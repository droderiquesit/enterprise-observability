# =============================================================================
# MONITOR ARCHETYPE CATALOG — SAAS DEPENDENCIES & EXTERNAL ENDPOINTS
#
# We cannot fix a SaaS vendor, so these archetypes exist to answer one question
# fast during an incident: "is it us or is it them?". They are therefore
# deliberately cheap, outside-in, and high-signal — and they are prime
# correlation PARENTS: a Salesforce outage should suppress twelve downstream
# integration alerts, not add a thirteenth.
# =============================================================================
version: 2
domain: saas

archetypes:

  synthetic-endpoint-down:
    title: External Endpoint Unavailable
    signal: availability
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: synthetic_check
    selector: ""
    query: 'sum(last_10m):sum:synthetics.test_runs{__SCOPE__,status:failed} by {check_id,location}.as_count() >= 3'
    thresholds: { critical: 3, warning: 1 }
    group_by: [check_id, location]
    evaluation_window: last_10m
    envs: [prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-external-dependency
    slo_relation: sli_producing
    runbook: synthetic-endpoint-down
    workflow: diag-external-endpoint
    failure_domain: external-endpoint
    mandatory: true
    notify_by: [check_id]
    rationale_fixed_threshold: >
      Three failures across locations distinguishes a real outage from one
      unhappy probe location.

  synthetic-latency-degradation:
    title: External Endpoint Latency Degradation
    signal: latency
    impact_class: degradation
    detection: rate_of_change
    monitor_type: query alert
    resource_type: synthetic_check
    selector: ""
    query: 'pct_change(avg(last_15m),last_4h):avg:synthetics.http.response_time{__SCOPE__} by {check_id} > 100'
    thresholds: { critical: 100, warning: 50 }
    group_by: [check_id]
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-external-dependency
    slo_relation: dependency
    runbook: synthetic-latency-degradation
    workflow: diag-external-endpoint
    failure_domain: external-endpoint
    mandatory: false

  synthetic-certificate-expiry:
    title: Endpoint TLS Certificate Approaching Expiry
    signal: certificate_expiry
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: synthetic_check
    selector: ""
    query: 'min(last_6h):min:synthetics.ssl.days_left{__SCOPE__} by {check_id} < 21'
    thresholds: { critical: 21, warning: 45 }
    group_by: [check_id]
    evaluation_window: last_6h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-external-dependency
    slo_relation: compliance
    runbook: synthetic-certificate-expiry
    workflow: auto-cert-renewal-ticket
    failure_domain: external-endpoint
    mandatory: true
    compliance: true
    rationale_fixed_threshold: "21 days matches the PKI renewal lead time."

  saas-availability:
    title: SaaS Dependency Unavailable
    signal: availability
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: saas_vendor
    selector: ""
    query: 'sum(last_15m):sum:synthetics.test_runs{__SCOPE__,status:failed} by {service}.as_count() >= 3'
    thresholds: { critical: 3, warning: 1 }
    group_by: [service]
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-external-dependency
    slo_relation: sli_producing
    runbook: saas-availability
    workflow: diag-external-endpoint
    failure_domain: saas-dependency
    mandatory: true
    rationale_fixed_threshold: "Vendor reachability is binary from our side."

  saas-latency-degradation:
    title: SaaS Dependency Latency Degradation
    signal: latency
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: saas_vendor
    selector: ""
    query: "avg(last_30m):anomalies(avg:trace.http.client.request.duration{__SCOPE__,peer.dependency_kind:external} by {service,peer.service}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [service, peer.service]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-external-dependency
    slo_relation: dependency
    runbook: saas-latency-degradation
    workflow: diag-dependency
    failure_domain: saas-dependency
    mandatory: false

  saas-error-anomaly:
    title: SaaS Dependency Error Anomaly
    signal: error_rate
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: saas_vendor
    selector: ""
    # Scoped to peers tagged as external dependencies. Without this filter the
    # query is byte-identical to the application domain's dependency archetype,
    # which the duplicate-monitor check correctly rejects — two monitors with the
    # same query are one monitor and one source of confusion.
    query: "avg(last_15m):anomalies(sum:trace.http.client.request.errors{__SCOPE__,peer.dependency_kind:external} by {service,peer.service}.as_rate(), 'agile', 3) >= 1"
    thresholds: { critical: 1.0 }
    group_by: [service, peer.service]
    evaluation_window: last_15m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-external-dependency
    slo_relation: dependency
    runbook: saas-error-anomaly
    workflow: diag-dependency
    failure_domain: saas-dependency
    mandatory: true

  saas-quota-forecast:
    title: SaaS API Quota Exhaustion Forecast
    signal: capacity
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: saas_vendor
    selector: ""
    query: "max(next_1d):forecast(sum:acme.saas.api_calls{__SCOPE__} by {service}.as_count() / avg:acme.saas.api_quota{__SCOPE__} by {service}, 'linear', 1, interval='60m', history='1w') > 0.9"
    thresholds: { critical: 0.9, warning: 0.8 }
    group_by: [service]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-external-dependency
    slo_relation: dependency
    runbook: saas-quota-forecast
    workflow: auto-capacity-ticket
    failure_domain: saas-dependency
    mandatory: true
    notes: >
      Vendor API quotas reset on their calendar, not ours, and exhausting one
      mid-month is a self-inflicted outage with days of warning.
