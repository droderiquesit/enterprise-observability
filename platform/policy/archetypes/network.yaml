# =============================================================================
# MONITOR ARCHETYPE CATALOG — NETWORKING
# Device, path, DNS and connectivity signals. Grouping is site → device →
# interface. Network alerts page only when they remove redundancy or break a
# named dependency — a single flapping access port is not an incident.
# =============================================================================
version: 2
domain: network

archetypes:

  network-device-unreachable:
    title: Network Device Unreachable
    signal: availability
    impact_class: customer_impact
    detection: service_check
    monitor_type: service check
    resource_type: network_device
    telemetry: [network_device_monitoring]
    selector: ""
    query: '"snmp.can_check".over("__SCOPE__").by("site","device").last(3).count_by_status()'
    thresholds: { critical: 2, warning: 1 }
    group_by: [site, device]
    evaluation_window: last_3_checks
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: network-device-unreachable
    workflow: diag-network
    failure_domain: network-core
    mandatory: true
    notify_by: [site]
    rationale_fixed_threshold: "Device reachability is binary."

  network-interface-errors:
    title: Interface Error Rate Rising
    signal: error_rate
    impact_class: risk
    detection: rate_of_change
    monitor_type: query alert
    resource_type: network_device
    telemetry: [network_device_monitoring]
    selector: ""
    query: 'pct_change(avg(last_15m),last_4h):sum:snmp.ifInErrors{__SCOPE__} by {device,interface}.as_rate() > 100'
    thresholds: { critical: 100, warning: 50 }
    group_by: [device, interface]
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: network-interface-errors
    workflow: diag-network
    failure_domain: network-core
    mandatory: false
    notify_by: [device]
    notes: >
      Rate-of-change, not absolute: a link with a stable low error count has a
      known cabling quirk; a link whose error rate doubles is failing now.

  network-interface-saturation-forecast:
    title: Link Saturation Forecast
    signal: capacity
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: network_device
    telemetry: [network_device_monitoring]
    selector: ""
    query: "max(next_1w):forecast(avg:snmp.ifBandwidthInUsage.rate{__SCOPE__} by {device,interface}, 'linear', 1, interval='60m', history='2w') > 80"
    thresholds: { critical: 80, warning: 70 }
    group_by: [device, interface]
    evaluation_window: next_1w
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: network-interface-saturation-forecast
    workflow: auto-capacity-ticket
    failure_domain: network-core
    mandatory: true
    notify_by: [device]

  network-packet-loss:
    title: Network Path Packet Loss
    signal: error_rate
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: network_path
    telemetry: [network_path_monitoring]
    selector: ""
    query: 'avg(last_10m):avg:network.path.loss_pct{__SCOPE__} by {source_site,destination} > 2'
    thresholds: { critical: 2, warning: 0.5 }
    group_by: [source_site, destination]
    notify_by: [source_site]
    evaluation_window: last_10m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: network-packet-loss
    workflow: diag-network
    failure_domain: connectivity
    mandatory: true
    rationale_fixed_threshold: >
      2% sustained loss is the point at which TCP throughput collapses for
      applications — a protocol boundary, not a baseline.

  network-path-latency-degradation:
    title: Network Path Latency Degradation
    signal: latency
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: network_path
    telemetry: [network_path_monitoring]
    selector: ""
    query: "avg(last_30m):anomalies(avg:network.path.latency{__SCOPE__} by {source_site,destination}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [source_site, destination]
    notify_by: [source_site]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-network-availability
    runbook: network-path-latency-degradation
    workflow: diag-network
    failure_domain: connectivity
    mandatory: false

  dns-resolution-failure:
    title: DNS Resolution Failing
    signal: availability
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: dns_zone
    telemetry: [synthetics]
    selector: ""
    query: 'sum(last_10m):sum:synthetics.dns.failures{__SCOPE__} by {zone,resolver}.as_count() >= 2'
    thresholds: { critical: 2, warning: 1 }
    group_by: [zone, resolver]
    notify_by: [zone]
    evaluation_window: last_10m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: dns-resolution-failure
    workflow: diag-network
    failure_domain: dns
    mandatory: true
    rationale_fixed_threshold: >
      DNS failure is binary and upstream of everything — this archetype is a
      designated correlation PARENT for the whole estate.

  vpn-tunnel-down:
    title: VPN / ExpressRoute Tunnel Down
    signal: availability
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: network_tunnel
    telemetry: [custom_network_state_export]
    selector: ""
    query: 'min(last_10m):avg:acme.network.tunnel_up{__SCOPE__} by {site,tunnel} < 1'
    thresholds: { critical: 1 }
    group_by: [site, tunnel]
    evaluation_window: last_10m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: vpn-tunnel-down
    workflow: diag-network
    failure_domain: connectivity
    mandatory: true
    notify_by: [site]
    rationale_fixed_threshold: "Tunnel state is binary."

  loadbalancer-pool-degraded:
    title: Load Balancer Pool Redundancy Degraded
    signal: availability
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: load_balancer
    telemetry: [custom_loadbalancer_export]
    selector: ""
    query: 'min(last_10m):avg:acme.lb.healthy_members{__SCOPE__} by {load_balancer,pool} / avg:acme.lb.total_members{__SCOPE__} by {load_balancer,pool} < 0.6'
    thresholds: { critical: 0.6, warning: 0.8 }
    group_by: [load_balancer, pool]
    notify_by: [load_balancer]
    evaluation_window: last_10m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-network-availability
    runbook: loadbalancer-pool-degraded
    workflow: diag-network
    failure_domain: network-edge
    mandatory: true
    rationale_fixed_threshold: "Redundancy ratios are a design contract."

  network-config-change:
    title: Unplanned Network Configuration Change
    signal: change
    impact_class: hygiene
    detection: event
    monitor_type: event-v2 alert
    resource_type: network_device
    telemetry: [network_automation_events]
    selector: ""
    query: 'events("source:network-automation __ESCOPE__ tags:\"event:config_change\" -tags:\"change_ticket:*\"").rollup("count").by("device").last("30m") >= 1'
    thresholds: { critical: 1 }
    group_by: [device]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-network-availability
    runbook: network-config-change
    workflow: auto-drift-ticket
    failure_domain: network-core
    mandatory: false
    rationale_fixed_threshold: >
      A configuration change without a change ticket is discrete and is the
      single highest-value correlation input for network incidents.
