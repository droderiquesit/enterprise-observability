name: deploy
# Controlled deployment from main only, behind the `datadog-production`
# environment (add a required reviewer there to make it an approval gate).
# Order: foundation → runbooks → coverage → post-deploy verification.
#
# Until the environment holds DD_API_KEY/DD_APP_KEY and stacks/backend.prod.hcl
# exists, every step no-ops with a notice instead of failing — an unconfigured
# pipeline reports "not configured", it does not report "broken".
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: deploy-datadog # never two applies at once

env:
  TF_VERSION: 1.9.8

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: datadog-production # approval gate + scoped secrets
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt

      - name: Preflight — are credentials and backend configured?
        id: pre
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ] || [ -z "$DD_APP_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set DD_API_KEY and DD_APP_KEY on the datadog-production environment (service account svc-observability-terraform). See docs/operating-model.md."
            exit 0
          fi
          if [ ! -f stacks/backend.prod.hcl ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Deploy blocked::Credentials are set but stacks/backend.prod.hcl is missing. Remote state is mandatory for applies — copy stacks/backend.prod.hcl.example and commit the non-secret backend settings."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Foundation — plan & apply
        if: steps.pre.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd stacks/foundation
          terraform init -reconfigure -input=false -backend-config=../backend.prod.hcl
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan

      - name: Runbooks — publish (API-backed, drift-aware; ADR-006)
        if: steps.pre.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python publish_runbooks.py

      - name: Coverage — plan & apply (monitors, SLOs, burn alerts)
        if: steps.pre.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd stacks/coverage
          terraform init -reconfigure -input=false -backend-config=../backend.prod.hcl
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan

      - name: Post-deploy verification — idempotency (second plan must be clean)
        if: steps.pre.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd stacks/coverage && terraform plan -input=false -detailed-exitcode
          cd ../foundation && terraform plan -input=false -detailed-exitcode

      - name: Post-deploy verification — coverage & contract report
        if: steps.pre.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd tools
          python build_inventory.py --live
          python profile_engine.py
          python coverage_report.py --live
      - name: Upload coverage report
        if: steps.pre.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: generated/coverage_report.*
