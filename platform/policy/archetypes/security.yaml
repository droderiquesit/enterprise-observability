# =============================================================================
# MONITOR ARCHETYPE CATALOG — SECURITY OPERATIONAL SIGNALS
#
# SCOPE BOUNDARY: this catalog covers the OPERATIONAL health of security
# controls and telemetry — "is the control working and are we still seeing
# its data?". Threat detection itself belongs in Cloud SIEM detection rules,
# which are owned by the security team and deliberately NOT managed here.
#
# Everything in this file routes through the security_operational notification
# profile: the responder is the security team, not the resource owner.
# =============================================================================
version: 2
domain: security

archetypes:

  security-log-source-missing:
    title: Security Log Source Stopped Delivering
    signal: telemetry_health
    # degradation, not customer_impact: the control is impaired and this must
    # page the security rotation, but no customer is losing a function right
    # now. Reserving customer_impact for actual customer loss is what keeps P1
    # meaningful.
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: log_source
    telemetry: [datadog_usage_metrics]
    selector: ""
    query: 'sum(last_1h):sum:datadog.estimated_usage.logs.ingested_events{__SCOPE__,security_relevant:true} by {log_source}.as_count() < 1'
    thresholds: { critical: 1 }
    group_by: [log_source]
    evaluation_window: last_1h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-security-telemetry
    runbook: security-log-source-missing
    workflow: diag-security-control
    failure_domain: security-telemetry
    mandatory: true
    notify_no_data: true
    no_data_timeframe: 90
    compliance: true
    rationale_fixed_threshold: >
      Absence of log delivery is binary. A silent security log source is a
      compliance failure and a blind spot: the control has effectively been
      removed even though no customer sees it.

  security-telemetry-volume-drop:
    title: Security Telemetry Volume Drop
    signal: telemetry_health
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: log_source
    telemetry: [datadog_usage_metrics]
    selector: ""
    query: "avg(last_2h):anomalies(sum:datadog.estimated_usage.logs.ingested_events{__SCOPE__,security_relevant:true} by {log_source}.as_rate(), 'robust', 3, direction='below', seasonality='daily') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [log_source]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical]
    slo_id: slo-security-telemetry
    runbook: security-telemetry-volume-drop
    workflow: diag-security-control
    failure_domain: security-telemetry
    mandatory: true
    compliance: true
    notes: >
      Catches partial blindness — a forwarder that drops one facility while
      still emitting enough traffic to look alive.

  security-agent-coverage-gap:
    title: Security Agent Coverage Gap
    signal: telemetry_health
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: host
    telemetry: [custom_security_control_export]
    selector: ""
    query: 'avg(last_2h):avg:acme.security.agent_coverage_pct{__SCOPE__} by {site} < 98'
    thresholds: { critical: 98, warning: 99.5 }
    group_by: [site]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-security-telemetry
    runbook: security-agent-coverage-gap
    workflow: diag-security-control
    failure_domain: security-controls
    mandatory: true
    compliance: true
    rationale_fixed_threshold: >
      98% endpoint coverage is the audited control objective. The number is
      the control.

  security-control-failure:
    title: Security Control Reporting Failure
    signal: control_failure
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: security_control
    telemetry: [custom_security_control_export]
    selector: ""
    query: 'sum(last_1h):sum:acme.security.control_checks{__SCOPE__,result:failed} by {control_id,control_name}.as_count() >= 1'
    thresholds: { critical: 1 }
    group_by: [control_id, control_name]
    evaluation_window: last_1h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-security-telemetry
    runbook: security-control-failure
    workflow: auto-compliance-ticket
    failure_domain: security-controls
    mandatory: true
    compliance: true
    rationale_fixed_threshold: "A failed control check is a discrete audit finding."

  auth-failure-anomaly:
    title: Authentication Failure Anomaly
    signal: auth_anomaly
    impact_class: degradation
    detection: seasonal_anomaly
    monitor_type: query alert
    resource_type: identity_provider
    telemetry: [custom_security_control_export]
    selector: ""
    query: "avg(last_30m):anomalies(sum:acme.identity.auth_failures{__SCOPE__} by {identity_provider,application}.as_rate(), 'robust', 3, direction='above', seasonality='weekly') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [identity_provider, application]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-security-telemetry
    runbook: auth-failure-anomaly
    workflow: diag-security-control
    failure_domain: identity-security
    mandatory: true
    notes: >
      Weekly seasonality matters here: Monday morning login failures are
      normal, the same volume at 03:00 Sunday is not.

  privileged-action-anomaly:
    title: Privileged Action Volume Anomaly
    signal: auth_anomaly
    impact_class: risk
    detection: anomaly
    monitor_type: query alert
    resource_type: identity_provider
    telemetry: [custom_security_control_export]
    selector: ""
    query: "avg(last_1h):anomalies(sum:acme.identity.privileged_actions{__SCOPE__} by {identity_provider}.as_rate(), 'agile', 4, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [identity_provider]
    evaluation_window: last_1h
    envs: [prod]
    bands: [critical]
    slo_id: slo-security-telemetry
    runbook: privileged-action-anomaly
    workflow: diag-security-control
    failure_domain: identity-security
    mandatory: false

  certificate-expiry:
    title: Certificate Approaching Expiry
    signal: certificate_expiry
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: certificate
    telemetry: [custom_certificate_inventory]
    selector: ""
    query: 'min(last_6h):min:acme.pki.days_until_expiry{__SCOPE__} by {certificate_cn,issuer} < 21'
    thresholds: { critical: 21, warning: 45 }
    group_by: [certificate_cn, issuer]
    evaluation_window: last_6h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-security-telemetry
    runbook: certificate-expiry
    workflow: auto-cert-renewal-ticket
    failure_domain: security-controls
    mandatory: true
    compliance: true
    rationale_fixed_threshold: >
      21 days is the renewal lead time the PKI process requires (CSR, approval,
      deployment window). The number encodes the process, not the metric.

  secret-rotation-overdue:
    title: Secret / Key Rotation Overdue
    signal: certificate_expiry
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: secret
    telemetry: [custom_security_control_export]
    selector: ""
    query: 'max(last_12h):max:acme.security.secret_age_days{__SCOPE__} by {vault,secret_name} > 90'
    thresholds: { critical: 90, warning: 75 }
    group_by: [vault, secret_name]
    evaluation_window: last_12h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-security-telemetry
    runbook: secret-rotation-overdue
    workflow: auto-compliance-ticket
    failure_domain: security-controls
    mandatory: true
    compliance: true
    rationale_fixed_threshold: "90-day rotation is the audited policy."

  audit-log-continuity-gap:
    title: Audit Log Continuity Gap
    signal: telemetry_health
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: log_source
    telemetry: [custom_security_control_export]
    selector: "compliance_scope:sox"
    query: 'sum(last_30m):sum:acme.security.audit_events{__SCOPE__} by {system}.as_count() < 1'
    thresholds: { critical: 1 }
    group_by: [system]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-security-telemetry
    runbook: audit-log-continuity-gap
    workflow: auto-compliance-ticket
    failure_domain: security-telemetry
    mandatory: true
    compliance: true
    notify_no_data: true
    no_data_timeframe: 45
    rationale_fixed_threshold: >
      An audit trail with a hole in it fails the control regardless of cause.
      Continuity is binary.
