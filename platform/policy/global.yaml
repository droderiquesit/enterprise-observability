# =============================================================================
# LAYER 0 — GLOBAL STANDARDS
# Root of the configuration hierarchy. Everything below inherits from here.
#
# Precedence (lowest → highest):
#   global → domain → archetype → profile → environment → tier → team → exception
# =============================================================================
version: 2

org:
  name: acme
  managed_by: terraform
  repo: droderiquesit/enterprise-observability
  docs_base_url: https://github.com/droderiquesit/enterprise-observability/blob/main/docs

# -----------------------------------------------------------------------------
# THE MINIMUM MANDATORY TAG SET
#
# Only FIVE tags are the responsibility of a service owner. Everything else is
# derived and stamped by the platform. This is deliberate: every additional
# mandatory tag is a new way for onboarding to fail.
# -----------------------------------------------------------------------------
owner_applied_tags:
  - env                 # dev | qa | stage | prod
  - service             # service catalog identity
  - team                # handle from teams.yaml
  - tier                # tier0..tier3  (business criticality)
  - service_archetype   # what KIND of thing this is → selects the monitor packs

# Derived by tools/profile_engine.py from the five above + policy. Never hand-set.
platform_derived_tags:
  - owner               # accountable team (defaults to `team`)
  - domain              # technology domain
  - monitoring_profile  # observe_only | baseline | standard | critical | regulated
  - alert_band          # none | baseline | standard | critical  ← monitor selector
  - support_model       # 24x7 | business_hours | none
  - managed_by          # terraform

# Stamped on every monitor by modules/monitor_factory. Never hand-set.
monitor_governance_tags:
  - priority            # P1..P4
  - archetype           # archetype id
  - impact_class        # customer_impact | degradation | risk | hygiene
  - detection           # anomaly | forecast | outlier | rate_of_change | threshold | ...
  - slo_id
  - runbook
  - automation_ref
  - notification_profile
  - failure_domain
  - correlation_key
  - dedup_key
  - managed_source      # platform | self_service | composite
  - monitor_id          # stable platform identifier

# Contextual tags — carried when the source system supplies them, never required.
contextual_tags:
  - region
  - subscription
  - account
  - cluster
  - datacenter
  - compliance_scope
  - data_classification
  - cost_center
  - request_id

# The mandatory tag set asserted on every MONITOR (coverage check C3).
required_monitor_tags:
  - env
  - service
  - team
  - owner
  - tier
  - priority
  - domain
  - resource_type
  - monitoring_profile
  - alert_band
  - managed_by
  - slo_id

tag_vocabulary:
  env: [dev, qa, stage, prod]
  tier: [tier0, tier1, tier2, tier3]
  priority: [P1, P2, P3, P4]
  monitoring_profile: [observe_only, baseline, standard, critical, regulated]
  alert_band: [none, baseline, standard, critical]
  impact_class: [customer_impact, degradation, risk, hygiene]
  detection:
    [anomaly, seasonal_anomaly, forecast, outlier, rate_of_change, threshold,
     service_check, slo_burn, composite, log_pattern, event]
  managed_by: [terraform]
  domain:
    [application, api, kubernetes, infrastructure, vmware, cloud, database,
     data, messaging, network, security, saas, integration, platform]
  service_archetype:
    [api, web, worker, event_consumer, batch_job, scheduled_job,
     integration_flow, saas_dependency, external_endpoint, platform_service,
     datastore, infrastructure_resource]

# -----------------------------------------------------------------------------
# MONITOR CONTRACT DEFAULTS
# Every alerting monitor inherits these unless a higher layer overrides them.
# -----------------------------------------------------------------------------
monitor_defaults:
  evaluation_delay: 300          # seconds — cloud/integration metrics lag
  new_group_delay: 300           # seconds — suppress evaluation on newly-seen groups
  renotify_interval: 60          # minutes, alert state only
  renotify_statuses: [alert]
  renotify_occurrences: 3        # stop re-paging after 3 reminders; escalation takes over
  notify_no_data: false          # telemetry-health archetypes override to true
  no_data_timeframe: 30          # minutes, when notify_no_data
  require_full_window: false
  notify_audit: false
  include_tags: true
  notify_by: []                  # set per-archetype to collapse group storms

  # --- AUTO-RESOLVE — Datadog `timeout_h` ------------------------------------
  # MANDATORY ON EVERY MANAGED MONITOR. This used to be `timeout_h: 0`, which is
  # Datadog's default and means "stay triggered forever". That is not a neutral
  # setting: while a group sits in an unresolved triggered state Datadog does
  # not notify again for the NEXT occurrence of the same condition, so one stuck
  # alert silently suppresses every future page for that group. The monitors
  # most likely to get stuck are the ones whose subject can disappear entirely
  # — a batch run that finished, a deployment event, a host that was retired —
  # and several of those page.
  #
  # WHAT IT IS NOT: `timeout_h` only applies when a monitor STOPS REPORTING DATA
  # while triggered. It cannot silence a condition that is still true — a
  # monitor that keeps evaluating keeps alerting, and one whose signal recovers
  # resolves normally. Absent telemetry is a different contract entirely
  # (`notify_no_data` / `no_data_timeframe`), which is why the telemetry_health
  # signal is deliberately NOT shortened below.
  #
  # `timeout_h` remains as the org-wide floor for anything that reaches the
  # monitor factory without a resolved value; the factory REJECTS 0 at plan
  # time, so this number can never quietly become "never resolves" again.
  timeout_h: 24
  auto_resolve:
    min_hours: 1
    # HARD VENDOR LIMIT, not a preference. The Datadog monitor API rejects
    # anything above 24 with
    #   400 "The timeout_h option should be an integer value in the range 0-24"
    # and it rejects it at VALIDATE time, so a longer window is not a slow
    # monitor — it is a monitor that cannot be created at all.
    max_hours: 24
    # Resolution order, first match wins:
    #   archetype `auto_resolve_hours` → by_signal → by_detection → by_priority
    #
    # Higher priority resolves SOONER, which reads backwards until you remember
    # what the setting does: a stuck P1 is the one suppressing the page that
    # matters. An outage that outlives this window is carried by the incident
    # record and by the monitor re-triggering the moment data returns, not by a
    # monitor state nobody is looking at.
    by_priority: { P1: 6, P2: 12, P3: 18, P4: 24 }
    by_signal:
      job_failure: 4        # a failed run is over; its group may never report again
      schedule_miss: 4      # ditto — the window that was missed does not come back
      change: 2             # a deployment/change is an instant, not a state
      auth_anomaly: 4       # discrete security events, not a level to recover from
      backup_age: 12
    by_detection:
      event: 2              # event monitors match discrete events and then stick
      service_check: 12     # a check stops reporting when its host/agent goes away

# -----------------------------------------------------------------------------
# CARDINALITY & MONITOR-EXPLOSION GUARDRAILS  (hard failures — see ADR-004)
# -----------------------------------------------------------------------------
cardinality:
  max_group_by_keys: 3
  max_groups_per_monitor: 1000
  max_instances_per_archetype: 12     # archetype × env × band ceiling
  max_total_managed_monitors: 1500    # platform-wide budget; CI fails above it
  # PAGING BUDGET — the number that actually protects humans. Monitor count is
  # a cost problem; paging count is a burnout problem. Both are asserted at
  # plan time so growth is a reviewed decision, not a drift.
  max_paging_monitors: 90
  # RAISED 70 → 85, deliberately, when the catalog took on the technologies the
  # estate actually runs: Azure SQL, on-premises SQL Server (Always On), Cosmos
  # DB, Snowflake, Front Door, Traffic Manager, ExpressRoute and Azure Firewall.
  # Each of those contributed exactly ONE unambiguous-outage pattern — the
  # database has no primary, the circuit's BGP session is down, the origin pool
  # is empty — and nothing else from those catalogs pages at all. Nine new
  # patterns against a 73-pattern estate is the honest cost of covering nine
  # technologies that previously had no coverage; the alternative was to leave
  # a SQL Server availability group with no primary replica unpaged.
  max_p1_monitors: 85
  forbidden_group_keys:
    [host_ip, container_id, pod_name, request_id, trace_id, path, url,
     user_id, session_id, instance_id, uuid]
  # A query whose scope is only `*` or only `env:x` with no further selector
  # matches the whole org — banned outside explicitly allowlisted archetypes.
  forbidden_query_patterns: ["{*}", "{ * }"]

# -----------------------------------------------------------------------------
# NAMING
# Names are stable and parseable. Tooling identity always comes from tags
# (monitor_id, archetype, slo_id), never from display names.
# -----------------------------------------------------------------------------
naming:
  monitor: "[{priority}][{env}][{domain}] {title} ({band})"
  composite: "[{priority}][{env}][{domain}] {title} (composite)"
  custom: "[{priority}][{env}][{domain}] {title} ({service})"
  slo_burn: "[{priority}][{env}][{domain}] {slo_name} — error budget burn ({window})"
  slo: "{slo_title}"
  runbook: "Runbook: {runbook_title}"
  notification_rule: "route-{notification_profile}-{team}-{priority}"

# -----------------------------------------------------------------------------
# MULTI-WINDOW BURN-RATE STANDARD  (Google SRE workbook, adapted per tier)
#   factor = burn multiple of the sustainable rate
#   Detection windows are long/short pairs: long confirms, short recovers fast.
# -----------------------------------------------------------------------------
# Only the FAST and MEDIUM windows page. A 24-hour burn is a real problem with
# days of budget left — waking someone for it teaches them that pages are not
# urgent, which is the expensive lesson.
burn_rate_windows:
  fast:   { long_window: "1h",  short_window: "5m",  factor: 14.4, impact_class: customer_impact, budget_consumed_pct: 2 }
  medium: { long_window: "6h",  short_window: "30m", factor: 6.0,  impact_class: customer_impact, budget_consumed_pct: 5 }
  slow:   { long_window: "24h", short_window: "2h",  factor: 3.0,  impact_class: risk,            budget_consumed_pct: 10 }
  trend:  { long_window: "72h", short_window: "6h",  factor: 1.0,  impact_class: hygiene,         budget_consumed_pct: 10 }

# -----------------------------------------------------------------------------
# DETECTION POLICY — predictive-first.
# A fixed threshold is only acceptable when the number itself carries
# operational meaning. Anything else needs `rationale_fixed_threshold`.
# -----------------------------------------------------------------------------
detection_policy:
  # Signals where an absolute boundary IS the operational contract.
  absolute_threshold_allowed_signals:
    [certificate_expiry, backup_age, freshness, quota, capacity_hard_limit,
     replication_lag, availability, job_failure, schedule_miss, control_failure,
     telemetry_absence, dlq_depth, restart_count, error_budget]
  # Behavioral signals must use a predictive technique unless justified.
  behavioral_signals: [latency, error_rate, throughput, saturation, cost, volume]
  predictive_functions: ["anomalies(", "forecast(", "outliers(", "pct_change("]
  min_anomaly_deviations: 2
  default_anomaly_algorithm: agile      # agile | basic | robust | seasonal
  seasonal_algorithm: robust

# =============================================================================
# TELEMETRY SOURCES — the controlled vocabulary for `telemetry:` on archetypes
# (requirement §38; the applicability engine in tools/applicability.py reads it)
#
# WHY THIS EXISTS. A monitor deployed where its telemetry source is absent does
# not fail — it goes green and stays green. That is the worst failure mode this
# platform can have, because the estate LOOKS covered. Declaring the source each
# archetype reads from turns "can this monitor ever fire here?" from an
# unanswerable question into a set difference.
#
# THE ID IS A THING SOMEONE MUST TURN ON. Every id below names one independently
# enablable producer — an Agent integration, a Datadog product, a cloud
# integration on a subscription, or a named custom emitter. Two signals share an
# id only when the SAME act of configuration produces both; that is why
# `kubernetes_integration` and `kube_state_metrics` are separate (a cluster can
# run the Agent without kube-state-metrics) and why each `acme.*` emitter from
# docs/telemetry-gaps.md gets its own id.
#
# `metric_namespaces` is a DERIVATION RULE, not documentation: the lint in
# tools/validate_policy.py derives the required set from each archetype's query
# by longest-prefix match and rejects a declaration that disagrees. A
# declaration therefore cannot drift from the query it describes, and a
# plausible-but-wrong value cannot be hand-written past review.
#
#   kind: agent | datadog_product | cloud_integration | agent_integration
#         | custom_emitter | log_derived | inventory_export
# =============================================================================
telemetry_sources:

  # --- Datadog Agent and Datadog products ----------------------------------
  agent:
    display: Datadog Agent (core checks)
    kind: agent
    metric_namespaces: ["system.", "process.", "ntp.", "datadog.agent."]
    provided_by: Agent installed and reporting on the host.

  apm:
    display: APM tracing
    kind: datadog_product
    metric_namespaces: ["trace."]
    provided_by: Application instrumented with a tracing library; traces reaching Datadog.

  apm_runtime_metrics:
    display: APM runtime metrics
    kind: datadog_product
    metric_namespaces: ["jvm.", "runtime."]
    # Separate from `apm` on purpose: a traced service emits NO runtime metrics
    # unless this flag is set, so the JVM/.NET archetypes are silent against a
    # service that is otherwise fully instrumented. See docs/telemetry-gaps.md.
    provided_by: DD_RUNTIME_METRICS_ENABLED=true on the traced process.

  rum:
    display: Real User Monitoring
    kind: datadog_product
    metric_namespaces: ["rum."]
    provided_by: RUM SDK deployed in the browser app with view metrics generated.

  synthetics:
    display: Synthetic Monitoring
    kind: datadog_product
    metric_namespaces: ["synthetics."]
    provided_by: A Synthetic test exists for the endpoint (public or private location).

  database_monitoring:
    display: Database Monitoring (DBM)
    kind: datadog_product
    metric_namespaces: ["datadog.dbm."]
    provided_by: DBM enabled on the instance, not just the base integration.

  ci_visibility:
    display: CI Visibility
    kind: datadog_product
    metric_namespaces: ["datadog.ci."]
    provided_by: Pipeline instrumented to report CI events to Datadog.

  datadog_usage_metrics:
    display: Datadog usage / ingestion metrics
    kind: datadog_product
    metric_namespaces: ["datadog.estimated_usage."]
    provided_by: Always present in a Datadog org; the SUBJECT of the metric may not be.

  network_path_monitoring:
    display: Network Path Monitoring
    kind: datadog_product
    metric_namespaces: ["network.path."]
    provided_by: Agent network path checks configured between the endpoints of interest.

  network_device_monitoring:
    display: Network Device Monitoring (SNMP)
    kind: agent_integration
    metric_namespaces: ["snmp."]
    provided_by: NDM configured with device profiles and SNMP credentials.

  # --- Cloud and technology integrations ------------------------------------
  azure_integration:
    display: Datadog Azure integration
    kind: cloud_integration
    metric_namespaces: ["azure."]
    event_sources: [azure]
    # Enabled PER SUBSCRIPTION. "Azure is integrated" org-wide is not the unit
    # that matters — one unregistered subscription silences every `azure.*`
    # monitor for everything inside it.
    provided_by: App registration + Datadog integration enabled on the subscription.

  azure_cost_management:
    display: Cloud Cost Management (Azure)
    kind: cloud_integration
    metric_namespaces: ["azure.cost."]
    provided_by: CCM enabled with billing export access; separate from the Azure integration.

  sqlserver_integration:
    display: SQL Server integration
    kind: agent_integration
    metric_namespaces: ["sqlserver."]
    provided_by: Agent sqlserver check with a monitoring login on the instance.

  postgresql_integration:
    display: PostgreSQL integration
    kind: agent_integration
    metric_namespaces: ["postgresql."]
    # Retained only for _migration-postgres-retirement.yaml. PostgreSQL is not
    # in this estate, which is exactly why those three archetypes are inert —
    # and the applicability engine is what makes that visible instead of
    # asserted in a comment.
    provided_by: Agent postgres check. NOT PRESENT in this estate.

  snowflake_integration:
    display: Snowflake integration
    kind: agent_integration
    metric_namespaces: ["snowflake."]
    provided_by: Agent snowflake check with a role able to read SNOWFLAKE.ACCOUNT_USAGE.

  vmware_integration:
    display: vSphere integration
    kind: agent_integration
    metric_namespaces: ["vsphere."]
    event_sources: [vsphere]
    provided_by: Agent vsphere check pointed at vCenter with a read-only account.

  kubernetes_integration:
    display: Kubernetes integration (kubelet / cluster agent)
    kind: agent_integration
    metric_namespaces: ["kubernetes."]
    provided_by: Datadog Agent DaemonSet with the kubelet check enabled.

  kube_state_metrics:
    display: Kubernetes State Metrics Core
    kind: agent_integration
    metric_namespaces: ["kubernetes_state."]
    provided_by: kube-state-metrics core check enabled on the cluster agent.

  # --- Custom emitters — the contracts in docs/telemetry-gaps.md ------------
  # Each of these is something that must be BUILT and KEPT RUNNING. They are
  # listed apart from the integrations because their failure mode differs: an
  # integration that is switched off is usually noticed, an exporter that
  # stopped is not, which is why several of them are themselves monitored.
  custom_api_gateway_metrics:
    display: API gateway request/limit metrics
    kind: custom_emitter
    metric_namespaces: ["api.gateway."]
    # NO EMISSION CONTRACT IS WRITTEN DOWN YET — recorded as an open gap in
    # docs/telemetry-gaps.md rather than left to look native because it is
    # namespaced like a product metric.
    provided_by: Gateway exporter (contract not yet specified).

  custom_app_pool_metrics:
    display: Application connection-pool metrics
    kind: custom_emitter
    metric_namespaces: ["acme.app."]
    provided_by: Pool instrumentation inside the application (telemetry-gaps §6).

  custom_backup_reporting:
    display: Backup completion reporting
    kind: custom_emitter
    metric_namespaces: ["acme.backup.", "acme.database.hours_since_backup"]
    provided_by: Backup system reports last-success age per protected object.

  custom_batch_job_metrics:
    display: Batch job execution metrics
    kind: custom_emitter
    metric_namespaces: ["acme.batch."]
    provided_by: Batch platform emits run outcome, duration, backlog and output age.

  custom_scheduler_metrics:
    display: Scheduler execution metrics
    kind: custom_emitter
    metric_namespaces: ["acme.scheduler."]
    # Separate from the batch emitter: a scheduler's primary failure is NOT
    # RUNNING, and only its own control plane can report a run that never
    # started. A batch exporter driven by job output cannot see that at all.
    provided_by: Scheduler control plane emits started/completed runs per job.

  cmdb_compliance_export:
    display: Configuration-management compliance export
    kind: inventory_export
    metric_namespaces: ["acme.compliance."]
    provided_by: Daily CMDB / config-management export (telemetry-gaps §8).

  custom_data_pipeline_metrics:
    display: Data pipeline run metrics and schema events
    kind: custom_emitter
    metric_namespaces: ["acme.data.", "acme.warehouse."]
    event_sources: [acme-data]
    provided_by: Pipeline framework emits run outcome, duration, volume and freshness.

  custom_restore_verification:
    display: Database restore-verification job
    kind: custom_emitter
    metric_namespaces: ["acme.database.restore_verification"]
    provided_by: Restore-and-CHECKDB job emitting age and failures (telemetry-gaps §1).

  custom_finops_exporter:
    display: Azure budget / burn-rate exporter
    kind: custom_emitter
    metric_namespaces: ["acme.finops."]
    provided_by: Scheduled Azure Consumption API exporter (telemetry-gaps §5).

  ipmi_hardware_check:
    display: Normalised IPMI hardware health
    kind: custom_emitter
    metric_namespaces: ["acme.hardware."]
    provided_by: Agent IPMI check plus the sensor-name normalisation map (telemetry-gaps §7).

  custom_security_control_export:
    display: Identity and security control export
    kind: custom_emitter
    metric_namespaces: ["acme.identity.", "acme.security."]
    provided_by: Identity provider and security control plane export their own outcomes.

  custom_integration_flow_metrics:
    display: Integration flow metrics
    kind: custom_emitter
    metric_namespaces: ["acme.integration."]
    provided_by: Integration platform emits per-flow delivery, errors and latency.

  custom_loadbalancer_export:
    display: Load-balancer pool membership export
    kind: custom_emitter
    metric_namespaces: ["acme.lb."]
    provided_by: On-premises load balancer exports healthy/total pool members.

  custom_messaging_client_metrics:
    display: Messaging client metrics
    kind: custom_emitter
    metric_namespaces: ["acme.messaging.", "acme.streaming."]
    # One id because ONE thing produces all of it: the consumer process. When
    # the consumer is gone every one of these metrics stops together, which is
    # precisely why `consumer-absent` exists alongside them (telemetry-gaps §3).
    provided_by: Consumer/producer instrumentation emitting lag, age and liveness.

  log_derived_nsg_flows:
    display: NSG denied-flow log metric
    kind: log_derived
    metric_namespaces: ["acme.network.nsg_denied_flows"]
    provided_by: NSG flow logs in Datadog Logs + the log-based metric (telemetry-gaps §4).

  custom_network_state_export:
    display: Network tunnel state export
    kind: custom_emitter
    metric_namespaces: ["acme.network.tunnel_up"]
    provided_by: Network automation polls tunnel state and emits it as a gauge.

  network_automation_events:
    display: Network automation change events
    kind: custom_emitter
    event_sources: [network-automation]
    provided_by: Network automation posts config-change events to the Datadog event stream.

  platform_self_telemetry:
    display: Observability platform self-telemetry
    kind: custom_emitter
    metric_namespaces: ["acme.observability."]
    provided_by: This platform's own tooling reports estate size, drift and unowned backlog.

  custom_certificate_inventory:
    display: Certificate inventory export
    kind: inventory_export
    metric_namespaces: ["acme.pki."]
    provided_by: PKI / certificate inventory emits days-until-expiry per certificate.

  custom_saas_quota_exporter:
    display: SaaS API quota exporter
    kind: custom_emitter
    metric_namespaces: ["acme.saas."]
    provided_by: Per-vendor exporter reading the vendor's own quota API.

  custom_snowflake_exporter:
    display: Snowflake task-history exporter
    kind: custom_emitter
    metric_namespaces: ["acme.snowflake."]
    provided_by: Scheduled TASK_HISTORY exporter (telemetry-gaps §2).

  custom_vmware_inventory_export:
    display: vSphere snapshot inventory export
    kind: inventory_export
    metric_namespaces: ["acme.vmware."]
    provided_by: vCenter inventory export emitting snapshot age per VM.
