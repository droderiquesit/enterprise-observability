# =============================================================================
# MONITOR ARCHETYPE CATALOG — DATABASES
# ENGINE-AGNOSTIC LAYER ONLY.
#
# This file used to carry a generic `db-*` layer written against PostgreSQL
# metrics (postgresql.queries.duration, postgresql.connections,
# postgresql.replication_delay, ...) and one Redis metric. PostgreSQL is not
# in this estate, so those monitors could never fire: they were coverage on
# paper and silence in practice, which is worse than an admitted gap.
#
# What remains here is genuinely engine-agnostic — DBM instance liveness and
# the backup contract. Everything engine-specific lives with its engine:
#   sqlserver.yaml   Azure SQL + on-premises Microsoft SQL Server
#   cosmosdb.yaml    Azure Cosmos DB
#   snowflake.yaml   Snowflake
# =============================================================================
version: 2
domain: database

archetypes:

  db-availability:
    title: Database Instance Unavailable
    signal: availability
    impact_class: customer_impact
    detection: service_check
    monitor_type: service check
    resource_type: db_instance
    selector: ""
    query: '"datadog.dbm.instance.up".over("__SCOPE__").by("db_instance").last(3).count_by_status()'
    thresholds: { critical: 2, warning: 1 }
    group_by: [db_instance]
    evaluation_window: last_3_checks
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-database-availability
    runbook: db-availability
    workflow: diag-database
    failure_domain: databases
    mandatory: true
    rationale_fixed_threshold: "Instance reachability is binary."

  db-backup-age:
    title: Database Backup Older Than RPO
    signal: backup_age
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: db_instance
    selector: ""
    query: 'max(last_4h):max:acme.database.hours_since_backup{__SCOPE__} by {db_instance} > 26'
    thresholds: { critical: 26, warning: 20 }
    group_by: [db_instance]
    evaluation_window: last_4h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-database-availability
    runbook: db-backup-age
    workflow: auto-compliance-ticket
    failure_domain: database-capacity
    mandatory: true
    compliance: true
    rationale_fixed_threshold: "24h RPO + 2h grace. The number is the control."

  azuresql-dtu-saturation:
    title: Azure SQL Compute Saturation Forecast
    signal: saturation
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: azure_sql
    selector: "resource_type:azure_sql"
    query: "max(next_1d):forecast(avg:azure.sql_servers_databases.dtu_consumption_percent{__SCOPE__} by {subscription_name,name}, 'linear', 1, interval='30m', history='1w') > 90"
    thresholds: { critical: 90, warning: 80 }
    group_by: [subscription_name, name]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-database-availability
    runbook: azuresql-dtu-saturation
    workflow: remediate-scale-workload
    failure_domain: database-capacity
    mandatory: true
    notify_by: [subscription_name]

  db-telemetry-loss:
    title: Database Stopped Reporting Telemetry
    signal: telemetry_health
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: db_instance
    selector: ""
    query: 'sum(last_30m):sum:sqlserver.stats.connections{__SCOPE__} by {db_instance}.as_count() < 1'
    thresholds: { critical: 1 }
    group_by: [db_instance]
    evaluation_window: last_30m
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-database-availability
    runbook: db-telemetry-loss
    workflow: diag-database
    failure_domain: databases
    mandatory: true
    notify_no_data: true
    no_data_timeframe: 45
    rationale_fixed_threshold: "Absence of telemetry is binary."
