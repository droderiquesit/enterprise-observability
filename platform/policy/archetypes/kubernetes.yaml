# =============================================================================
# MONITOR ARCHETYPE CATALOG — KUBERNETES / CONTAINER PLATFORM
#
# Grouping strategy is deliberate and uniform: cluster → namespace → workload.
# NEVER pod_name or container_id — a 50-node rollout would create tens of
# thousands of groups and turn a single deploy into an alert storm.
# =============================================================================
version: 2
domain: kubernetes

archetypes:

  k8s-deployment-unavailable:
    title: Kubernetes Deployment Has No Available Replicas
    signal: availability
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: kube_deployment
    selector: ""
    query: 'min(last_10m):sum:kubernetes_state.deployment.replicas_available{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_deployment} < 1'
    thresholds: { critical: 1, warning: 2 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: last_10m
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-deployment-unavailable
    workflow: diag-k8s-workload
    failure_domain: kubernetes-workloads
    mandatory: true
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: >
      Zero available replicas is the definition of unavailable. The replica
      count is a declared contract, not an observed baseline.

  k8s-deployment-degraded-redundancy:
    title: Kubernetes Deployment Redundancy Degraded
    signal: availability
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: kube_deployment
    selector: ""
    query: 'min(last_15m):sum:kubernetes_state.deployment.replicas_available{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_deployment} / sum:kubernetes_state.deployment.replicas_desired{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_deployment} < 0.6'
    thresholds: { critical: 0.6, warning: 0.8 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-deployment-degraded-redundancy
    workflow: diag-k8s-workload
    failure_domain: kubernetes-workloads
    mandatory: false
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: >
      Redundancy ratios are a design contract (HA requires >60% of desired
      replicas to survive a node loss); this is capacity math, not a baseline.

  k8s-pod-crashloop:
    title: Pods in CrashLoopBackOff
    signal: availability
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: kube_pod
    selector: ""
    query: 'max(last_10m):sum:kubernetes_state.container.status_report.count.waiting{__SCOPE__,reason:crashloopbackoff} by {kube_cluster_name,kube_namespace,kube_deployment} >= 1'
    thresholds: { critical: 1 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: last_10m
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-pod-crashloop
    workflow: diag-k8s-workload
    failure_domain: kubernetes-workloads
    mandatory: true
    notify_by: [kube_cluster_name]
    release_gate: true
    rationale_fixed_threshold: >
      CrashLoopBackOff is a discrete Kubernetes state, not a metric level.

  k8s-restart-anomaly:
    title: Container Restart Anomaly
    signal: availability
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: kube_pod
    selector: ""
    query: "avg(last_30m):anomalies(sum:kubernetes.containers.restarts{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_deployment}.as_rate(), 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-restart-anomaly
    workflow: diag-k8s-workload
    failure_domain: kubernetes-workloads
    mandatory: false
    notify_by: [kube_cluster_name]

  k8s-oomkill:
    title: Container OOMKilled
    signal: saturation
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: kube_pod
    selector: ""
    query: 'sum(last_15m):sum:kubernetes_state.container.status_report.count.terminated{__SCOPE__,reason:oomkilled} by {kube_cluster_name,kube_namespace,kube_deployment}.as_count() >= 1'
    thresholds: { critical: 1 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: last_15m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-oomkill
    workflow: diag-k8s-workload
    failure_domain: kubernetes-workloads
    mandatory: true
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: >
      An OOMKill is a discrete kernel event; one occurrence is meaningful.

  k8s-memory-saturation-forecast:
    title: Workload Memory Saturation Forecast
    signal: saturation
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: kube_deployment
    selector: ""
    query: "max(next_1d):forecast(avg:kubernetes.memory.usage_pct{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_deployment}, 'linear', 1, interval='30m', history='1w') > 0.95"
    thresholds: { critical: 0.95, warning: 0.85 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-memory-saturation-forecast
    workflow: remediate-scale-workload
    failure_domain: kubernetes-workloads
    mandatory: false
    notify_by: [kube_cluster_name]

  k8s-cpu-throttling:
    title: Workload CPU Throttling
    signal: saturation
    impact_class: risk
    detection: anomaly
    monitor_type: query alert
    resource_type: kube_deployment
    selector: ""
    query: "avg(last_30m):anomalies(avg:kubernetes.cpu.throttled.periods{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_deployment}.as_rate(), 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [kube_cluster_name, kube_namespace, kube_deployment]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-cpu-throttling
    workflow: remediate-scale-workload
    failure_domain: kubernetes-workloads
    mandatory: false
    notify_by: [kube_cluster_name]

  k8s-pods-pending:
    title: Pods Cannot Be Scheduled
    signal: availability
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: kube_pod
    selector: ""
    query: 'min(last_15m):sum:kubernetes_state.pod.status_phase{__SCOPE__,phase:pending} by {kube_cluster_name,kube_namespace} >= 3'
    thresholds: { critical: 3, warning: 1 }
    group_by: [kube_cluster_name, kube_namespace]
    evaluation_window: last_15m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-pods-pending
    workflow: diag-k8s-workload
    failure_domain: kubernetes-nodes
    mandatory: true
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: >
      Sustained Pending is a scheduler verdict (insufficient resources, taints,
      quota) — a state, not a level.

  k8s-node-not-ready:
    title: Kubernetes Node Not Ready
    signal: availability
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: kube_node
    selector: ""
    query: 'max(last_10m):sum:kubernetes_state.node.status{__SCOPE__,status:false,condition:ready} by {kube_cluster_name,node} >= 1'
    thresholds: { critical: 1 }
    group_by: [kube_cluster_name, node]
    evaluation_window: last_10m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-node-not-ready
    workflow: diag-k8s-workload
    failure_domain: kubernetes-nodes
    mandatory: true
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: "NotReady is a discrete node condition."

  k8s-node-pressure:
    title: Node Resource Pressure
    signal: saturation
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: kube_node
    selector: ""
    query: 'max(last_15m):sum:kubernetes_state.node.by_condition{__SCOPE__,condition:memorypressure,status:true} by {kube_cluster_name,node} >= 1'
    thresholds: { critical: 1 }
    group_by: [kube_cluster_name, node]
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-node-pressure
    workflow: diag-k8s-workload
    failure_domain: kubernetes-nodes
    mandatory: false
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: "Kubelet pressure conditions are discrete states."

  k8s-cluster-capacity-forecast:
    title: Cluster Capacity Exhaustion Forecast
    signal: saturation
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: kube_cluster
    selector: ""
    query: "max(next_1w):forecast(sum:kubernetes.cpu.requests{__SCOPE__} by {kube_cluster_name} / sum:kubernetes.cpu.capacity{__SCOPE__} by {kube_cluster_name}, 'linear', 1, interval='60m', history='2w') > 0.9"
    thresholds: { critical: 0.9, warning: 0.8 }
    group_by: [kube_cluster_name]
    evaluation_window: next_1w
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-cluster-capacity-forecast
    workflow: auto-capacity-ticket
    failure_domain: kubernetes-nodes
    mandatory: true

  k8s-hpa-at-max:
    title: Horizontal Pod Autoscaler Pinned At Maximum
    signal: saturation
    impact_class: risk
    detection: threshold
    monitor_type: query alert
    resource_type: kube_hpa
    selector: ""
    query: 'min(last_30m):sum:kubernetes_state.hpa.current_replicas{__SCOPE__} by {kube_cluster_name,kube_namespace,hpa} - sum:kubernetes_state.hpa.max_replicas{__SCOPE__} by {kube_cluster_name,kube_namespace,hpa} >= 0'
    thresholds: { critical: 0 }
    group_by: [kube_cluster_name, kube_namespace, hpa]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-hpa-at-max
    workflow: auto-capacity-ticket
    failure_domain: kubernetes-workloads
    mandatory: false
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: >
      "At max replicas" is a configured ceiling — the autoscaler has run out of
      the room it was given and cannot absorb more load.

  k8s-pvc-capacity-forecast:
    title: Persistent Volume Exhaustion Forecast
    signal: saturation
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: kube_pvc
    selector: ""
    query: "max(next_1d):forecast(avg:kubernetes.kubelet.volume.stats.used_bytes{__SCOPE__} by {kube_cluster_name,kube_namespace,persistentvolumeclaim} / avg:kubernetes.kubelet.volume.stats.capacity_bytes{__SCOPE__} by {kube_cluster_name,kube_namespace,persistentvolumeclaim}, 'linear', 1, interval='60m', history='1w') > 0.9"
    thresholds: { critical: 0.9, warning: 0.8 }
    group_by: [kube_cluster_name, kube_namespace, persistentvolumeclaim]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-pvc-capacity-forecast
    workflow: auto-capacity-ticket
    failure_domain: kubernetes-workloads
    mandatory: true
    notify_by: [kube_cluster_name]

  k8s-cronjob-failure:
    title: Kubernetes CronJob Failing
    signal: job_failure
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: kube_cronjob
    selector: ""
    query: 'sum(last_1h):sum:kubernetes_state.job.failed{__SCOPE__} by {kube_cluster_name,kube_namespace,kube_cronjob}.as_count() >= 1'
    thresholds: { critical: 1 }
    group_by: [kube_cluster_name, kube_namespace, kube_cronjob]
    evaluation_window: last_1h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-cronjob-failure
    workflow: remediate-rerun-job
    failure_domain: kubernetes-workloads
    mandatory: true
    notify_by: [kube_cluster_name]
    rationale_fixed_threshold: "A failed job is a discrete outcome."

  k8s-control-plane-latency:
    title: Kubernetes API Server Latency Degradation
    signal: latency
    impact_class: degradation
    detection: rate_of_change
    monitor_type: query alert
    resource_type: kube_cluster
    selector: ""
    query: 'pct_change(avg(last_15m),last_1h):avg:kubernetes.apiserver.request.latency{__SCOPE__} by {kube_cluster_name} > 150'
    thresholds: { critical: 150, warning: 75 }
    group_by: [kube_cluster_name]
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-control-plane-latency
    workflow: diag-k8s-workload
    failure_domain: kubernetes-control-plane
    mandatory: false

  k8s-telemetry-loss:
    title: Kubernetes Cluster Stopped Reporting
    signal: telemetry_health
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: kube_cluster
    selector: ""
    query: 'sum(last_30m):sum:kubernetes.pods.running{__SCOPE__} by {kube_cluster_name}.as_count() < 1'
    thresholds: { critical: 1 }
    group_by: [kube_cluster_name]
    evaluation_window: last_30m
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-k8s-workload-availability
    runbook: k8s-telemetry-loss
    workflow: diag-k8s-workload
    failure_domain: kubernetes-control-plane
    mandatory: true
    notify_no_data: true
    no_data_timeframe: 45
    rationale_fixed_threshold: "Absence of cluster telemetry is binary."
