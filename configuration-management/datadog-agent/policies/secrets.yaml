# =============================================================================
# SECRET REFERENCES (§15). THIS FILE CONTAINS NO SECRETS AND NEVER WILL.
#
# Every entry is a HANDLE: the name an ENC[] reference in a rendered config
# resolves through, plus where the material actually lives and who owns it.
# The rendered configuration contains `ENC[handle]`; the Datadog Agent's
# secret backend is the only component that ever sees a value.
#
# THE PROPERTY THIS BUYS. A rendered config can be committed, diffed, hashed
# for drift detection and pasted into a ticket, because it is not sensitive.
# That is what makes the drift model in docs/troubleshooting.md possible at
# all — you cannot compare hashes of files you are not allowed to read.
#
# CI greps every rendered configuration for anything that looks like key
# material and fails the build on a hit; see tests/test_agent_config.py.
# =============================================================================
version: 2

backend:
  kind: azure_key_vault
  # The Agent calls this executable, which authenticates with the host's
  # managed identity and returns only the handles it was asked for. It is not
  # a general-purpose vault client and cannot enumerate.
  windows_command: "%PROGRAMFILES%\\Datadog\\secrets\\datadog-secrets.exe"
  linux_command: "/opt/datadog-agent/secrets/datadog-secrets"
  vault: "kv-observability-prod"
  auth: managed_identity
  # Least privilege: the identity holds `get` on the named secrets and nothing
  # else. It cannot list, cannot write, and cannot read a secret it was not
  # explicitly granted.
  permissions: ["secrets/get"]

handles:
  datadog_api_key:
    purpose: Agent submission to Datadog.
    owner: sre
    rotation_days: 365
    scope: All Agents. One key for the fleet — a key per host multiplies
      rotation work by the estate size and buys nothing, because a compromised
      host can read its own key either way.

  sqlserver_monitoring_password:
    purpose: SQL Server monitoring login used by the sqlserver integration and DBM.
    owner: data-engineering
    rotation_days: 90
    scope: Least privilege — see docs/database-monitoring.md for the exact
      grants. It is not db_owner and it is not sysadmin.

  azure_sql_monitoring_password:
    purpose: Azure SQL monitoring login on the centralized database poller.
    owner: data-engineering
    rotation_days: 90

  vmware_readonly_password:
    purpose: vCenter read-only account for the VMware poller.
    owner: infrastructure-engineering
    rotation_days: 180
    scope: vSphere Read-Only role at the datacenter level. Read-only is
      sufficient for every metric this platform collects; write access on a
      monitoring account is a finding, not a convenience.

  synthetics_private_location_config:
    purpose: Private-location worker configuration blob issued by Datadog.
    owner: sre
    rotation_days: 365
    scope: One per private location. It authenticates the worker to Datadog and
      is not interchangeable between locations.
