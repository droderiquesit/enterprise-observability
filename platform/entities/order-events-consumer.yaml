# Migrated from platform/services/order-events-consumer.yaml (Phase 1, §5/§10).
#
# The point the old model could not make: this is a SERVICE that consumes a
# QUEUE. `orders-topic` used to be a bare string in `dependencies` that
# resolved to nothing; it is now a real `queue` entity, so the dependency
# resolves to `queue:orders-topic` and the catalog stops calling a Service Bus
# topic a service.
entity:
  kind: service
  name: order-events-consumer
  team: application-development
  criticality: tier1
  service_archetype: event_consumer
  description: Consumes order lifecycle events and updates downstream systems.
  envs: [dev, qa, stage, prod]
  env: prod
  slo:
    profile: domain            # tier1 default (tiers.yaml slo.scope)
  dependencies: [orders-topic, orders-sql]
  links:
    - { name: Repository, type: repo, url: https://github.com/acme/order-events-consumer }
