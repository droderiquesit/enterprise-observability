# Self-service monitor request — the ONLY thing an application team writes.
# Everything else (message contract, tags, routing, recovery, correlation
# metadata) is generated by the platform. Validated in CI by
# tools/validate_manifests.py against platform/requests/schema.json.
kind: monitor-request
title: Checkout p99 latency above contractual limit
service: efront_website_cxo
env: prod
domain: application
team: application-development
criticality: tier1
severity_class: page
monitor_type: query alert
query: "avg(last_10m):p99:trace.http.request.duration{env:prod,service:efront_website_cxo} > 2.5"
thresholds:
  critical: 2.5
  warning: 2.0
group_by: []
slo_id: slo-app-latency
runbook: "Runbook: Application Latency Degradation"
workflow: auto-enrich-latency
summary: "Checkout p99 latency exceeded the 2.5s contractual limit agreed with the payments partner."
impact: "Checkout conversions degrade measurably above 2.5s; partner SLA penalties apply."
justification: >
  Fixed threshold approved: 2.5s is a contractual absolute from the partner
  SLA, not a statistical judgement (platform standard requires justification
  for fixed thresholds on latency signals).
