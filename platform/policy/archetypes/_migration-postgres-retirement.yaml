# =============================================================================
# TRANSITIONAL — DELETE THIS FILE IN THE NEXT RELEASE
#
# WHY IT EXISTS. Three PostgreSQL-era monitors could not be deleted in the
# same apply that moved the composite and the SLO off them:
#
#   error deleting monitor 314408729: monitor [...Database Query Latency
#   Anomaly] is referenced in composite monitors: [314408959, Database
#   Saturation Is Impacting Applications]
#   error deleting monitor 314408609: ... is referenced in slos:
#   [Database platform availability]
#
# Datadog refuses to delete a monitor that a composite or an SLO still points
# at, and Terraform sequences the composite/SLO update AFTER the monitor map it
# depends on — so within one apply the delete always runs first and always
# fails. Re-running does not help: the apply aborts before the composite is
# ever updated.
#
# The fix is a two-phase migration, which is what this file is:
#
#   PHASE A (this release)  The three archetypes are restored at EXACTLY the
#                           instance they still occupy in production —
#                           prod × critical, nothing else — so Terraform makes
#                           no change to them. The composite and the SLO in
#                           composites.yaml / slos.yaml already name their
#                           replacements, so this apply updates those two
#                           objects and leaves the old monitors orphaned but
#                           alive.
#   PHASE B (next release)  Delete this file. Nothing references the three
#                           monitors any more, so the delete succeeds.
#
# They are inert in the meantime: PostgreSQL is not in this estate, so these
# queries have never matched a series and cannot fire. They are marked P4 by
# impact_class so that even if telemetry appeared, nothing would page.
#
# Their runbooks deliberately point at db-availability rather than adding three
# runbook entries the platform is about to delete.
# =============================================================================
version: 2
domain: database

archetypes:

  db-query-latency-anomaly:
    title: Database Query Latency Anomaly
    signal: latency
    impact_class: hygiene
    detection: anomaly
    monitor_type: query alert
    resource_type: db_instance
    selector: ""
    query: "avg(last_30m):anomalies(avg:postgresql.queries.duration{__SCOPE__} by {db_instance}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [db_instance]
    evaluation_window: last_30m
    envs: [prod]
    bands: [critical]
    slo_id: slo-database-latency
    slo_relation: diagnostic
    runbook: db-availability
    workflow: diag-database
    failure_domain: databases
    notes: "Retiring — see the file header. PostgreSQL is not in this estate."

  db-connection-saturation:
    title: Database Connection Pool Saturation Forecast
    signal: saturation
    impact_class: hygiene
    detection: forecast
    monitor_type: query alert
    resource_type: db_instance
    selector: ""
    query: "max(next_1d):forecast(avg:postgresql.connections{__SCOPE__} by {db_instance} / avg:postgresql.max_connections{__SCOPE__} by {db_instance}, 'linear', 1, interval='30m', history='1w') > 0.9"
    thresholds: { critical: 0.9 }
    group_by: [db_instance]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical]
    slo_id: slo-database-availability
    slo_relation: slo_supporting
    runbook: db-availability
    workflow: diag-database
    failure_domain: databases
    notes: "Retiring — see the file header. PostgreSQL is not in this estate."

  db-replication-lag:
    title: Database Replication Lag Beyond Limit
    signal: replication_lag
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: db_instance
    selector: ""
    query: "avg(last_10m):avg:postgresql.replication_delay{__SCOPE__} by {db_instance} > 300"
    thresholds: { critical: 300, warning: 120 }
    group_by: [db_instance]
    evaluation_window: last_10m
    envs: [prod]
    bands: [critical]
    slo_id: slo-database-availability
    slo_relation: slo_supporting
    runbook: db-availability
    workflow: diag-database
    failure_domain: databases
    rationale_fixed_threshold: "Retiring — see the file header. PostgreSQL is not in this estate."
    notes: "Retiring — see the file header."
