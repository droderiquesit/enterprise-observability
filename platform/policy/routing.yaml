# Severity model and centrally-managed, tag-based routing (ADR-005).
# Monitors carry routing TAGS (severity, team, routing_rule, snow_record);
# datadog_monitor_notification_rule resources map tags → destinations.
version: 1

severities:
  sev1:
    behavior: immediate page + Datadog incident (SEV-1) + ServiceNow P1 + Teams channel + exec channel
    routing_rule: incident-page
    snow_record: incident-p1
    ack_timeout_minutes: 5
    escalation_timeout_minutes: 10
    pages: true
  sev2:
    behavior: page owning team when sustained; ServiceNow P2; Teams channel
    routing_rule: incident-page
    snow_record: incident-p2
    ack_timeout_minutes: 10
    escalation_timeout_minutes: 20
    pages: true
  sev3:
    behavior: ServiceNow work item; Teams channel; business-hours response
    routing_rule: ticket-only
    snow_record: task-p3
    pages: false
  informational:
    behavior: event only — never routed, never pages
    routing_rule: event-only
    snow_record: none
    pages: false

# Destination handles (Datadog integration handles, defined once, org-wide).
# ServiceNow and Teams handles are created by their Datadog integrations.
destinations:
  servicenow:
    incident-p1: "@servicenow-acme-incident-p1"
    incident-p2: "@servicenow-acme-incident-p2"
    task-p3: "@servicenow-acme-task"
  teams_exec_channel: "@teams-ExecBridge-alerts"

# Notification-rule matrix is generated as: one rule per (team × severity
# class) matching tags [managed_by:terraform, team:<t>, severity:<s>] →
# the team's Teams channel + on-call page handle + ServiceNow handle.
