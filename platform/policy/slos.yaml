# =============================================================================
# SLO CATALOG
#
# TWO SCOPES, and the distinction is what keeps SLO count sane at 100k services:
#
#   scope: domain    ONE SLO per domain, computed across every service in that
#                    domain (grouped SLI query). Covers tier1/tier2 services.
#                    ~20 SLOs total for the whole enterprise.
#
#   scope: service   Per-service SLO, generated ONLY for tier0 services from
#                    the service registry. A tier0 service deserves its own
#                    error budget; a tier2 internal tool does not.
#
# Burn-rate monitors are generated from `burn_alerts` — they are the PRIMARY
# customer-impact paging signal in this framework. Everything else supports
# diagnosis.
# =============================================================================
version: 2

# Objective defaults by tier come from tiers.yaml; a catalog entry may override.
slos:

  # --- application -----------------------------------------------------------
  slo-app-availability:
    name: Application availability
    scope: domain
    domain: application
    service: application-platform
    team: sre
    type: metric
    target: 99.9
    timeframe: 30d
    query:
      numerator: "sum:trace.span.hits{env:prod,alert_band:critical}.as_count() - sum:trace.span.errors{env:prod,alert_band:critical}.as_count()"
      denominator: "sum:trace.span.hits{env:prod,alert_band:critical}.as_count()"
    burn_alerts: [fast, medium, slow]

  slo-app-latency:
    name: Application latency objective
    scope: domain
    domain: application
    service: application-platform
    team: sre
    type: metric
    target: 99.0
    timeframe: 30d
    query:
      numerator: "sum:trace.span.hits{env:prod,alert_band:critical,latency_bucket:fast}.as_count()"
      denominator: "sum:trace.span.hits{env:prod,alert_band:critical}.as_count()"
    burn_alerts: [fast, slow]

  slo-web-availability:
    name: Web frontend availability
    scope: domain
    domain: application
    service: web-frontends
    team: sre
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes: [web-synthetic-availability, web-origin-5xx-anomaly]
    burn_alerts: [fast, slow]

  slo-worker-throughput:
    name: Asynchronous processing reliability
    scope: domain
    domain: application
    service: worker-platform
    team: sre
    type: monitor
    target: 99.5
    timeframe: 30d
    member_archetypes: [worker-stalled, worker-error-anomaly]
    burn_alerts: [slow]

  # --- api -------------------------------------------------------------------
  slo-api-availability:
    name: API availability
    scope: domain
    domain: api
    service: api-services
    team: application-development
    type: metric
    target: 99.95
    timeframe: 30d
    query:
      numerator: "sum:trace.http.request.hits{env:prod,alert_band:critical}.as_count() - sum:trace.http.request.errors{env:prod,alert_band:critical,http.status_class:5xx}.as_count()"
      denominator: "sum:trace.http.request.hits{env:prod,alert_band:critical}.as_count()"
    burn_alerts: [fast, medium, slow]

  slo-api-latency:
    name: API latency objective
    scope: domain
    domain: api
    service: api-services
    team: application-development
    type: metric
    target: 99.5
    timeframe: 30d
    query:
      numerator: "sum:trace.http.request.hits{env:prod,alert_band:critical,latency_bucket:fast}.as_count()"
      denominator: "sum:trace.http.request.hits{env:prod,alert_band:critical}.as_count()"
    burn_alerts: [fast, slow]

  # --- kubernetes ------------------------------------------------------------
  slo-k8s-workload-availability:
    name: Kubernetes workload availability
    scope: domain
    domain: kubernetes
    service: kubernetes-platform
    team: cloud-engineering
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes: [k8s-deployment-unavailable, k8s-pod-crashloop, k8s-node-not-ready]
    burn_alerts: [fast, slow]

  # --- infrastructure --------------------------------------------------------
  slo-infra-compute-availability:
    name: Compute platform availability
    scope: domain
    domain: infrastructure
    service: compute-platform
    team: infrastructure-engineering
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes: [host-unavailable, host-filesystem-readonly]
    # No burn-rate alerts: Datadog only supports burn_rate() on monitor-based
    # SLOs whose members are METRIC monitors, and both members here are
    # service checks (found by live plan validation: "Alerting on monitor
    # based SLOs currently supports metric monitors"). The SLO still tracks
    # the error budget; paging for compute comes from the members themselves
    # (host-unavailable is P1). Revisit if the SLO gains metric members or
    # the vendor lifts the constraint.
    burn_alerts: []

  slo-infra-backup-success:
    name: Backup success rate
    scope: domain
    domain: infrastructure
    service: backup-platform
    team: infrastructure-engineering
    type: metric
    target: 99.0
    timeframe: 30d
    query:
      numerator: "sum:acme.backup.jobs{env:prod,status:success}.as_count()"
      denominator: "sum:acme.backup.jobs{env:prod}.as_count()"
    burn_alerts: [slow]
    telemetry_dependency: "acme.backup.jobs — custom metric, producer must be deployed"

  # --- vmware ----------------------------------------------------------------
  slo-vmware-cluster-availability:
    name: Virtualization platform availability
    scope: domain
    domain: vmware
    service: virtualization-platform
    team: infrastructure-engineering
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes: [vmware-host-disconnected, vmware-cluster-ha-degraded]
    burn_alerts: [slow]

  # --- cloud -----------------------------------------------------------------
  slo-cloud-platform-availability:
    name: Azure platform reliability
    scope: domain
    domain: cloud
    service: azure-landing-zone
    team: cloud-engineering
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes:
      [azure-appservice-unavailable, azure-loadbalancer-probe-failure,
       azure-appgateway-backend-unhealthy, azure-keyvault-availability]
    burn_alerts: [fast, slow]

  # --- database --------------------------------------------------------------
  slo-database-availability:
    name: Database platform availability
    scope: domain
    domain: database
    service: database-platform
    team: data-engineering
    type: monitor
    target: 99.95
    timeframe: 30d
    member_archetypes:
      [db-availability, sqlserver-instance-unreachable, sqlserver-ag-sync-unhealthy,
       azuresql-unavailable, cosmos-service-availability,
       snowflake-connectivity-failure]
    burn_alerts: [fast, medium, slow]

  # Rebuilt as a MONITOR SLO, for the same reason slo-database-availability was.
  # It used to be a metric SLO over `postgresql.queries.count`, left behind when
  # the database domain was rebuilt for the real estate (Azure SQL, SQL Server,
  # Cosmos DB, Snowflake — no PostgreSQL anywhere). Live, it read:
  #
  #   state: no_data — "overall denominator (total events) is 0"
  #
  # A denominator that is permanently zero is the worst shape an objective can
  # take: it never breaches, never burns budget, and never alerts, so it reads
  # as a promise being kept. It was measuring an engine this estate does not run.
  #
  # There is no cross-engine "fast queries / total queries" ratio to replace it
  # with — Azure SQL, Cosmos and Snowflake each expose latency differently — so
  # the objective is expressed the way the platform already expresses
  # multi-engine database health: over the latency monitors themselves.
  # TWO-PHASE MIGRATION — PHASE A. `burn_alerts` is deliberately empty; restore
  # it to [slow] in the next release and delete this note.
  #
  # Changing `type` from metric to monitor forces Terraform to REPLACE the SLO,
  # and Datadog refuses to delete an SLO a monitor still references:
  #
  #   409 Conflict: slo d0fb22d3f0fb59669... is referenced in monitor_id: 314427621
  #
  # 314427621 is this objective's OWN burn-rate monitor. Its query embeds the
  # SLO id — burn_rate("d0fb...").over("30d") — so the reference is a literal
  # inside the monitor, not a soft association. Leaving `burn_alerts: [slow]`
  # unchanged meant Terraform saw no reason to touch that monitor, so the SLO
  # destroy ran first and always failed.
  #
  # Emptying `burn_alerts` is what fixes the ORDER. The burn monitor is built
  # from `module.slos.slo_datadog_ids[slo_id]` (stacks/coverage/slos.tf), which
  # is a real dependency edge, so Terraform destroys the dependent monitor
  # before it destroys the SLO it depends on. The replace then finds nothing
  # referencing it.
  #
  # PHASE B is one line: `burn_alerts: [slow]`. It is a pure create against the
  # new SLO id, with no ordering hazard.
  #
  # The generalisation, which cost two failed applies to learn: an SLO whose
  # TYPE changes cannot be migrated in the same apply as the burn monitors that
  # reference it, because a type change is a replace and a burn monitor pins the
  # id it was created against.
  slo-database-latency:
    name: Database query latency objective
    scope: domain
    domain: database
    service: database-platform
    team: data-engineering
    type: monitor
    target: 99.0
    timeframe: 30d
    member_archetypes:
      [sqlserver-lock-wait-degradation, sqlserver-blocking-sessions,
       sqlserver-log-flush-wait-degradation, azuresql-log-write-saturation,
       cosmos-server-side-latency-anomaly, snowflake-query-latency-anomaly,
       snowflake-warehouse-queueing]
    burn_alerts: []

  # --- data ------------------------------------------------------------------
  slo-data-freshness:
    name: Data product freshness
    scope: domain
    domain: data
    service: data-platform
    team: data-engineering
    type: monitor
    target: 99.0
    timeframe: 30d
    member_archetypes: [pipeline-output-stale, pipeline-volume-anomaly, data-quality-check-failure]
    burn_alerts: [fast, slow]

  # --- messaging -------------------------------------------------------------
  slo-messaging-delivery:
    name: Message delivery reliability
    scope: domain
    domain: messaging
    service: messaging-platform
    team: cloud-engineering
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes: [consumer-absent, messaging-publish-failure, broker-namespace-throttling]
    burn_alerts: [fast, slow]

  # --- network ---------------------------------------------------------------
  slo-network-availability:
    name: Network availability
    scope: domain
    domain: network
    service: network-platform
    team: infrastructure-engineering
    type: monitor
    target: 99.95
    timeframe: 30d
    member_archetypes: [network-device-unreachable, dns-resolution-failure, vpn-tunnel-down]
    burn_alerts: [fast, medium, slow]

  # --- security --------------------------------------------------------------
  slo-security-telemetry:
    name: Security telemetry continuity
    scope: domain
    domain: security
    service: security-telemetry
    team: security
    type: monitor
    target: 99.5
    timeframe: 30d
    member_archetypes: [security-log-source-missing, audit-log-continuity-gap, security-control-failure]
    burn_alerts: [fast, slow]

  # --- saas ------------------------------------------------------------------
  slo-external-dependency:
    name: External dependency availability
    scope: domain
    domain: saas
    service: external-dependencies
    team: sre
    type: monitor
    target: 99.5
    timeframe: 30d
    member_archetypes: [synthetic-endpoint-down, saas-availability]
    burn_alerts: [slow]

  # --- integration -----------------------------------------------------------
  slo-integration-delivery:
    name: Integration delivery reliability
    scope: domain
    domain: integration
    service: integration-platform
    team: application-development
    type: monitor
    target: 99.5
    timeframe: 30d
    member_archetypes: [schedule-missed-run, integration-flow-failure, partner-file-delivery-missed]
    burn_alerts: [fast, slow]

  slo-batch-completion:
    name: Batch completion reliability
    scope: domain
    domain: integration
    service: batch-platform
    team: application-development
    type: monitor
    target: 99.0
    timeframe: 30d
    member_archetypes: [batch-job-failure, batch-output-freshness]
    burn_alerts: [slow]

  # --- platform --------------------------------------------------------------
  slo-platform-services:
    name: Shared platform services availability
    scope: domain
    domain: platform
    service: platform-services
    team: observability-platform
    type: monitor
    target: 99.9
    timeframe: 30d
    member_archetypes: [platform-service-unavailable, ingest-pipeline-degraded]
    burn_alerts: [fast, slow]

# -----------------------------------------------------------------------------
# PER-SERVICE SLOs — NOT DEFINED HERE
#
# They live in platform/policy/slo_profiles.yaml, which resolves a service's
# objectives through the §12 chain (enterprise → entity type → platform →
# criticality → environment → profile → the service's own override).
#
# This file previously carried a `tier0_slo_template`: one HTTP-trace SLI
# applied to every tier0 service, at one target, with one objective. It could
# not express a second objective, and it measured a tier0 datastore with
# `trace.http.request.*` — a query that returns nothing, and therefore an SLO
# that is permanently, silently green. The profile model replaced it; a tier0
# service that names no profile still resolves exactly the objective the
# template produced, which is what made the change safe to apply.
# -----------------------------------------------------------------------------
