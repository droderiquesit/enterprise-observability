# =============================================================================
# MONITOR ARCHETYPE CATALOG — DATA PLATFORM
#
# The data domain's customer impact is FRESHNESS and CORRECTNESS, not uptime.
# A pipeline that runs perfectly and produces stale or wrong data is a worse
# outage than one that fails loudly — so freshness and volume are the
# customer_impact signals here, and job failure is only degradation.
# =============================================================================
version: 2
domain: data

archetypes:

  pipeline-output-stale:
    title: Data Product Freshness Breach
    signal: freshness
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: data_product
    selector: ""
    query: 'max(last_30m):max:acme.data.minutes_since_update{__SCOPE__} by {data_product,pipeline} > 120'
    thresholds: { critical: 120, warning: 60 }
    group_by: [data_product, pipeline]
    evaluation_window: last_30m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-data-freshness
    slo_relation: sli_producing
    runbook: pipeline-output-stale
    workflow: diag-data-pipeline
    failure_domain: data-pipelines
    mandatory: true
    rationale_fixed_threshold: >
      Freshness SLAs are contractual with the consuming business unit. The
      threshold IS the agreement (2h for operational marts).

  pipeline-job-failure:
    title: Data Pipeline Job Failure
    signal: job_failure
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: pipeline
    selector: ""
    # Grouped by data_product AND pipeline so this can be composited with the
    # freshness archetype — Datadog only evaluates a composite per group when
    # the member groupings are identical. The pipeline runner is required to
    # emit `data_product` on its run metric; that is an instrumentation
    # contract, recorded here because a monitor depends on it.
    query: 'sum(last_1h):sum:acme.data.pipeline.runs{__SCOPE__,status:failed} by {data_product,pipeline}.as_count() >= 1'
    thresholds: { critical: 1 }
    group_by: [data_product, pipeline]
    evaluation_window: last_1h
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-data-freshness
    slo_relation: slo_supporting
    runbook: pipeline-job-failure
    workflow: remediate-rerun-job
    failure_domain: data-pipelines
    mandatory: true
    rationale_fixed_threshold: "A failed run is a discrete outcome."

  pipeline-duration-anomaly:
    title: Pipeline Duration Anomaly
    signal: latency
    impact_class: risk
    detection: anomaly
    monitor_type: query alert
    resource_type: pipeline
    selector: ""
    query: "avg(last_2h):anomalies(avg:acme.data.pipeline.duration_seconds{__SCOPE__} by {pipeline}, 'robust', 3, direction='above', seasonality='daily') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [pipeline]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-data-freshness
    slo_relation: slo_supporting
    runbook: pipeline-duration-anomaly
    workflow: diag-data-pipeline
    failure_domain: data-pipelines
    mandatory: true
    notes: >
      Seasonal (robust/daily) because nightly loads legitimately take longer at
      month-end. A duration anomaly is the earliest predictor of a freshness
      breach that has not happened yet.

  pipeline-volume-anomaly:
    title: Data Volume Anomaly
    signal: volume
    impact_class: customer_impact
    detection: anomaly
    monitor_type: query alert
    resource_type: data_product
    selector: ""
    query: "avg(last_2h):anomalies(sum:acme.data.rows_written{__SCOPE__} by {data_product}.as_count(), 'robust', 3, seasonality='weekly') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [data_product]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical]
    slo_id: slo-data-freshness
    slo_relation: sli_producing
    runbook: pipeline-volume-anomaly
    workflow: diag-data-pipeline
    failure_domain: data-quality
    mandatory: true
    notes: >
      Catches the silent failure mode that job-status monitoring cannot see:
      the job succeeds and writes 4 rows instead of 4 million.

  data-quality-check-failure:
    title: Data Quality Check Failed
    signal: correctness
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: data_product
    selector: ""
    query: 'sum(last_2h):sum:acme.data.quality_checks{__SCOPE__,result:failed} by {data_product,check_name}.as_count() >= 1'
    thresholds: { critical: 1 }
    group_by: [data_product, check_name]
    evaluation_window: last_2h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-data-freshness
    slo_relation: sli_producing
    runbook: data-quality-check-failure
    workflow: diag-data-pipeline
    failure_domain: data-quality
    mandatory: true
    rationale_fixed_threshold: "A failed assertion is discrete."

  data-schema-drift:
    title: Schema Drift Detected
    signal: correctness
    impact_class: risk
    detection: event
    monitor_type: event-v2 alert
    resource_type: data_product
    selector: ""
    query: 'events("source:acme-data __ESCOPE__ tags:\"event:schema_drift\"").rollup("count").by("data_product").last("1h") >= 1'
    thresholds: { critical: 1 }
    group_by: [data_product]
    evaluation_window: last_1h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-data-freshness
    slo_relation: diagnostic
    runbook: data-schema-drift
    workflow: diag-data-pipeline
    failure_domain: data-quality
    mandatory: false
    rationale_fixed_threshold: "Schema change is a discrete event."

  warehouse-queue-saturation:
    title: Warehouse Query Queue Saturation
    signal: saturation
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: warehouse
    selector: ""
    query: "max(next_1d):forecast(avg:acme.warehouse.queued_queries{__SCOPE__} by {warehouse}, 'linear', 1, interval='30m', history='1w') > 50"
    thresholds: { critical: 50, warning: 25 }
    group_by: [warehouse]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-data-freshness
    slo_relation: slo_supporting
    runbook: warehouse-queue-saturation
    workflow: remediate-scale-workload
    failure_domain: data-warehouse
    mandatory: false

  streaming-consumer-lag-forecast:
    title: Streaming Consumer Lag Forecast
    signal: saturation
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: stream_consumer
    selector: ""
    query: "max(next_1d):forecast(avg:acme.streaming.consumer_lag_records{__SCOPE__} by {stream,consumer_group}, 'linear', 1, interval='15m', history='1d') > 1000000"
    thresholds: { critical: 1000000, warning: 250000 }
    group_by: [stream, consumer_group]
    evaluation_window: next_1d
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-data-freshness
    slo_relation: slo_supporting
    runbook: streaming-consumer-lag-forecast
    workflow: remediate-scale-workload
    failure_domain: data-pipelines
    mandatory: true

  data-telemetry-loss:
    title: Data Platform Stopped Reporting
    signal: telemetry_health
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: pipeline
    selector: ""
    query: 'sum(last_2h):sum:acme.data.pipeline.runs{__SCOPE__}.as_count() < 1'
    thresholds: { critical: 1 }
    group_by: []
    evaluation_window: last_2h
    envs: [dev, prod, stage, qa]
    bands: [critical, standard, baseline]
    slo_id: slo-data-freshness
    slo_relation: slo_supporting
    runbook: data-telemetry-loss
    workflow: diag-data-pipeline
    failure_domain: data-pipelines
    mandatory: true
    notify_no_data: true
    no_data_timeframe: 180
    rationale_fixed_threshold: "Absence of any pipeline run telemetry is binary."
