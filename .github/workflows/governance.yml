name: governance
# =============================================================================
# THE CONTINUOUS GOVERNANCE LOOP.
#
# Coverage that is only measured at deploy time decays silently. These runs are
# what keep the claims true between deployments: a red run here is a governance
# incident for the observability-platform team, with an SLA, not a warning.
# =============================================================================
on:
  schedule:
    - cron: "0 6 * * *"     # drift, nightly
    - cron: "0 7 * * 1-5"   # coverage & quality, weekday mornings
  workflow_dispatch:
# Each cron fires ONE job (gated per job below) — GitHub itself triggers the
# whole workflow on every schedule, so without the gates both jobs would run
# on both crons. workflow_dispatch runs both.

permissions:
  contents: read
  issues: write

# Shares the state lock with deploy.yml: drift must never read state that an
# in-flight apply is about to rewrite.
concurrency: tfstate

jobs:
  drift:
    name: drift detection
    if: github.event.schedule != '0 7 * * 1-5'
    runs-on: ubuntu-latest
    environment: datadog-plan
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r tools/requirements.txt

      - name: Terraform drift — click-ops edits and deletions, every environment
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          # `terraform plan -detailed-exitcode` returns 0 (clean), 2 (drift), or
          # 1 (couldn't even plan — bad creds, provider outage, broken config).
          # A version of this script once only checked for 2, so a hard error
          # reported as a quiet, false-green success — the opposite of "a red
          # run here is a governance incident, not a warning". Both 1 and 2
          # must fail this step; only the message told apart.
          set +e
          drift=0
          hard_error=0
          check() {   # $1 = plan's exit code, $2 = human label
            case "$1" in
              0) : ;;
              2) echo "DRIFT: $2"; drift=1 ;;
              *) echo "ERROR ($1): $2 — plan did not complete, see log above"; hard_error=1 ;;
            esac
          }

          ( cd stacks/foundation \
              && ../../tools/tfstate-git.sh restore foundation prod \
              && terraform init -input=false >/dev/null \
              && terraform plan -input=false -detailed-exitcode )
          check $? "foundation/prod"

          cd stacks/coverage
          terraform init -input=false >/dev/null
          for env in qa stage prod; do
            ../../tools/tfstate-git.sh restore coverage "$env"
            terraform plan -input=false -var "environments=[\"$env\"]" -detailed-exitcode
            check $? "coverage/$env"
          done

          [ "$drift" -eq 0 ] && [ "$hard_error" -eq 0 ]

      - name: Runbook drift — published notebooks vs the repository
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python publish_runbooks.py --check

      # "A red run here is a governance incident" applies to drift exactly as
      # it does to coverage — without this the drift job could fail silently
      # every night while only the coverage job ever opened issues.
      - name: Open a governance issue when drift is detected
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Governance: drift detected (${new Date().toISOString().slice(0,10)})`,
              body: `Terraform or runbook drift was detected against the live org. ` +
                    `See the failed step's log for the exact resources: ${runUrl}`,
              labels: ['governance', 'observability-platform'],
            });

  coverage:
    name: coverage & quality
    if: github.event.schedule != '0 6 * * *'
    runs-on: ubuntu-latest
    environment: datadog-plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r tools/requirements.txt

      - name: Rebuild inventory → assign profiles → measure coverage
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd tools
          python build_inventory.py --live
          python profile_engine.py
          python coverage_report.py --live --gate governance

      - name: Monitor quality scorecard
        if: always()
        run: cd tools && python monitor_scorecard.py --min-fleet-score 85 --max-failing 0

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [ -f generated/coverage_report.md ]; then
            cat generated/coverage_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ No coverage report was generated — the measurement step " \
                 "failed before producing output. See the earlier step's log." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-${{ github.run_id }}
          path: generated/

      # Runs on ANY job failure, not only a red (but present) report — an
      # early crash that never produced generated/coverage_report.md is a
      # WORSE governance gap than a red report, and must not go unreported
      # just because the file this step used to assume always exists doesn't.
      - name: Open a governance issue when the report is red — or missing entirely
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'generated/coverage_report.md';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `**No coverage report was produced.** The measurement step failed ` +
                `before \`coverage_report.py\` could run — most commonly missing or ` +
                `invalid \`DD_API_KEY\`/\`DD_APP_KEY\`, or a live Datadog API error. ` +
                `See the failed step's log in this run: ${runUrl}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Governance: coverage report red (${new Date().toISOString().slice(0,10)})`,
              body: body.slice(0, 60000),
              labels: ['governance', 'observability-platform'],
            });
