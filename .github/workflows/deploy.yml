name: deploy
# =============================================================================
# CONTROLLED PROMOTION — the SAME definitions move through every environment.
#
#   dev (0 monitors, by policy) → qa → stage → prod
#
# Nothing is copied between environments. Promotion narrows the `environments`
# variable to exactly one environment per apply, each with ITS OWN state file,
# so promoting one environment can never rewrite another's resources.
# Production requires a manual approval on the `datadog-production` GitHub
# environment.
#
# STATE (ADR-016): git-backed on the orphan branch `tfstate` of this repo,
# moved in/out by tools/tfstate-git.sh. The `concurrency: tfstate` group —
# shared with governance.yml — is the lock: no two state-touching runs
# overlap anywhere in the repository.
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Promotion target"
        required: true
        default: nonprod
        type: choice
        options: [nonprod, production]
  push:
    branches: [main]

permissions:
  contents: write   # push state commits to the tfstate branch

concurrency: tfstate

env:
  TF_VERSION: "1.9.8"
  PYTHON_VERSION: "3.11"

  # DEPLOYMENT METADATA (§8, docs/tagging-standard.md § Deployment metadata).
  #
  # `version` is grouped on by two deployment archetypes and, until this block
  # existed, was emitted by nothing at all — so both grouped by a tag nobody
  # sent and evaluated against an empty set. This fixes it for the one service
  # this repository actually deploys: the monitoring configuration itself.
  # It does NOT and cannot set DD_VERSION for the estate's applications; those
  # live in their own pipelines, and the standard is the contract they follow.
  #
  # run_number + sha rather than a tag: it is monotonic, unique per apply, and
  # carries the commit, so a version string is enough to find the diff.
  DD_SERVICE: observability-platform
  DD_VERSION: "${{ github.run_number }}-${{ github.sha }}"
  DD_GIT_COMMIT_SHA: "${{ github.sha }}"
  DD_GIT_REPOSITORY_URL: "${{ github.server_url }}/${{ github.repository }}"

jobs:
  # ---------------------------------------------------------------------------
  nonprod:
    name: "promote → dev, qa, then stage"
    runs-on: ubuntu-latest
    environment: datadog-nonprod
    # Runs on every push to main and on both dispatch targets — a production
    # promotion re-applies qa and stage first, preserving promotion order.
    if: github.event_name == 'push' || inputs.target == 'nonprod' || inputs.target == 'production'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -r tools/requirements.txt

      # Runbooks are published BEFORE the qa/stage apply for the same reason
      # they are before the prod apply: a monitor's runbook is attached through
      # its native `assets` field, and the attachment needs the notebook id.
      #
      # This step used to exist only in the production job, which left a real
      # gap: qa and stage applied FIRST, in this job, so a monitor whose runbook
      # had never been published deployed with no attachment and only production
      # got one. Six qa/stage monitors shipped that way. Publishing is
      # idempotent (content-hash compared, no-op when unchanged), so running it
      # in both jobs costs nothing and makes each job self-sufficient.
      - name: "Runbooks — publish notebooks and bind ids before applying"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python publish_runbooks.py --write-registry

      # COMMIT THE REGISTRY BACK, or the ids just written are discarded with the
      # checkout. That is not cosmetic: the nightly drift job runs
      # `publish_runbooks.py --check`, which fails on any registry entry with no
      # id — so a registry nobody commits makes governance permanently red, and
      # a permanently red gate is one people stop reading. It also leaves every
      # local consumer (the coverage matrix, the catalog reconciler) working
      # from a registry that trails production.
      #
      # Recorded HERE rather than in the production job because this job runs on
      # every push and every dispatch, and publishing is idempotent — by the
      # time production republishes there is nothing new to record.
      #
      # `[skip ci]` is load-bearing: a push to the default branch re-triggers
      # this workflow, so without it every release that adds a runbook would
      # deploy twice.
      - name: "Record the published notebook ids in the repository"
        run: |
          git config user.name  "observability-deploy[bot]"
          git config user.email "observability-deploy@users.noreply.github.com"
          if git diff --quiet -- platform/policy/runbooks.yaml; then
            echo "registry unchanged — every runbook already had an id"
            exit 0
          fi
          git add platform/policy/runbooks.yaml
          git commit -F - <<'MSG'
          Record published runbook notebook ids [skip ci]

          Written by publish_runbooks.py --write-registry during a deploy, so
          that publish_runbooks.py --check stays green and monitor `assets`
          attachment resolves from the repository rather than only from the org.
          MSG
          # A rejected push is not a deploy failure. The notebooks exist in
          # Datadog either way and the next run re-adopts them by name, so
          # failing an otherwise good apply over a git race would be the wrong
          # trade. Warn loudly instead.
          git push origin "HEAD:${{ github.ref_name }}" ||
            echo "::warning::could not push the runbook registry; notebook ids remain unrecorded in git"

      - name: Plan & apply, one environment at a time — dev, then qa, then stage
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          git config user.name  "observability-deploy[bot]"
          git config user.email "observability-deploy@users.noreply.github.com"
          cd stacks/coverage
          terraform init -input=false >/dev/null
          # State is persisted even when apply FAILS: a partial apply has
          # already created real resources, and losing the state that tracks
          # them with the runner turns a red apply into an orphan fleet.
          for env in dev qa stage; do
            ../../tools/tfstate-git.sh restore coverage "$env"
            terraform plan  -input=false -var "environments=[\"$env\"]" -out=tfplan
            rc=0; terraform apply -input=false tfplan || rc=$?
            if [ -f terraform.tfstate ]; then ../../tools/tfstate-git.sh persist coverage "$env"; fi
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          done
          exit 0

      # Emitted only after a green apply — a marker for a deployment that did
      # not complete is worse than none, because the correlation view would
      # then blame a change that never landed. dev is deliberately skipped: it
      # instantiates zero monitors by policy, so there is no behaviour for a
      # version to correlate with.
      - name: "Deployment marker — record the configuration version (§8)"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          for env in qa stage; do
            DD_ENV="$env" python tools/emit_deployment_event.py
          done

  # ---------------------------------------------------------------------------
  production:
    name: "promote → prod"
    runs-on: ubuntu-latest
    needs: [nonprod]
    # Production NEVER deploys from a bare push — only an explicit
    # workflow_dispatch with target=production. The datadog-production
    # environment adds a reviewer gate wherever one is configured.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment: datadog-production      # approval gate + scoped secrets
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -r tools/requirements.txt
      - name: Configure state-branch committer
        run: |
          git config user.name  "observability-deploy[bot]"
          git config user.email "observability-deploy@users.noreply.github.com"

      # Foundation first: an alert that fires into a routing void is worse than
      # no alert, because it creates the appearance of coverage.
      - name: "1 · Foundation — teams, routing, on-call, workflows, RBAC"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd stacks/foundation
          ../../tools/tfstate-git.sh restore foundation prod
          terraform init -input=false >/dev/null
          # workflow_budget comes from the committed budget.auto.tfvars so the
          # idempotency gate and nightly drift agree on the same selection.
          terraform plan  -input=false -out=tfplan
          rc=0; terraform apply -input=false tfplan || rc=$?
          # Persist even on failure — see the nonprod job's comment.
          if [ -f terraform.tfstate ]; then ../../tools/tfstate-git.sh persist foundation prod; fi
          exit "$rc"

      # Publishing runs BEFORE the coverage apply on purpose: it creates any
      # unpublished runbook notebook and writes its id into
      # platform/policy/runbooks.yaml in this checkout, so the apply that
      # follows can attach every runbook to its monitors through the native
      # `assets` field. Without --write-registry a newly-added runbook would
      # deploy a monitor with no attachment and the C16 gate would fail the run.
      - name: "2 · Runbooks — publish notebooks and bind ids (ADR-006)"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python publish_runbooks.py --write-registry

      - name: "3 · Coverage — monitors, SLOs, burn-rate alerts, composites"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd stacks/coverage
          ../../tools/tfstate-git.sh restore coverage prod
          terraform init -input=false >/dev/null
          terraform plan  -input=false -var 'environments=["prod"]' -out=tfplan
          rc=0; terraform apply -input=false tfplan || rc=$?
          # Persist even on failure — see the nonprod job's comment.
          if [ -f terraform.tfstate ]; then ../../tools/tfstate-git.sh persist coverage prod; fi
          exit "$rc"

      # ---- post-deployment validation ----------------------------------------
      - name: "4 · Idempotency — a second plan must be empty"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          cd stacks/foundation && terraform plan -input=false -detailed-exitcode
          cd ../coverage && terraform plan -input=false -var 'environments=["prod"]' -detailed-exitcode

      - name: "5 · Coverage & compliance report against the live org"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        # --gate deploy: this step blocks on platform-integrity findings only
        # (coverage gaps, contract violations on managed monitors/SLOs). The
        # full report — estate hygiene included — is still generated and
        # uploaded; the NIGHTLY governance run gates on everything and opens
        # issues, so estate findings are chased without holding deploys red.
        run: |
          cd tools
          python build_inventory.py --live
          python profile_engine.py
          python coverage_report.py --live --gate deploy

      - name: "6 · Quality scorecard against the catalog"
        run: cd tools && python monitor_scorecard.py --min-fleet-score 85 --max-failing 0

      # The audit table: one row per deployed monitor with its owner, route,
      # escalation policy, attached runbook notebook and final status. Written
      # from the LIVE estate so the ids are real, and uploaded with the rest of
      # the post-deploy evidence.
      - name: "7 · Monitor reconciliation against the live estate"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python reconciliation_report.py --live

      # Fleet compliance against the live estate: how much of the fleet is
      # actually instrumented, which is the denominator every monitor in this
      # deploy depends on. REPORT-ONLY by decision — see
      # platform/policy/agent_profiles.yaml → compliance.ratio.report_targets.
      # Gating before the first rollout wave would produce a permanently red
      # deploy, and a gate everyone learns to ignore protects nothing.
      - name: "8 · Fleet compliance — agent, integration and tag coverage (§39)"
        # `always()` so the report still runs when an earlier step failed, and
        # `continue-on-error` because the comment above says this does not gate.
        # Without the second flag the "non-gating" report failed the job anyway,
        # which is the kind of contradiction that teaches people to ignore a
        # red deploy.
        if: always()
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python fleet_compliance.py --live

      # Last, and only on a green run: the marker says "this configuration
      # version is live", which is only true if everything above succeeded.
      - name: "9 · Deployment marker — record the configuration version (§8)"
        env:
          DD_ENV: prod
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python emit_deployment_event.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-evidence
          path: generated/
