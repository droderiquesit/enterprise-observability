# Security coverage pack. All archetypes route to the security team regardless
# of resource ownership (security_sensitive profile override).
version: 1
domain: security
archetypes:
  security-log-source-missing:
    title: Security Log Source Missing
    class: security_telemetry_gap
    detection: threshold
    monitor_type: query alert
    query: "sum(last_2h):sum:acme.security.log_sources_reporting{env:__ENV__} by {log_source}.as_count() < 1"
    thresholds: { critical: 1 }
    group_by: [log_source]
    severity_class: page
    slo_id: slo-sec-log-freshness
    runbook: "Runbook: Security Log Source Missing"
    workflow: auto-enrich-availability
    failure_domain: security-telemetry
    notify_no_data: true
    no_data_timeframe: 120

  security-telemetry-volume-drop:
    title: Security Telemetry Volume Drop
    class: security_telemetry_gap
    detection: rate_of_change
    monitor_type: query alert
    query: "pct_change(avg(last_1h),last_4h):sum:acme.security.events_ingested{env:__ENV__} by {log_source}.as_count() < -70"
    thresholds: { critical: -70, warning: -50 }
    group_by: [log_source]
    severity_class: page
    slo_id: slo-sec-log-freshness
    runbook: "Runbook: Log Source Silence"
    workflow: auto-enrich-availability
    failure_domain: security-telemetry

  auth-failure-anomaly:
    title: Authentication Anomaly
    class: auth_anomaly
    detection: anomaly
    monitor_type: query alert
    query: "avg(last_30m):anomalies(sum:acme.security.auth_failures{env:__ENV__} by {idp}.as_rate(), 'agile', 4) >= 1"
    thresholds: { critical: 1.0 }
    group_by: [idp]
    severity_class: page
    slo_id: slo-sec-notification-delivery
    runbook: "Runbook: Authentication Anomaly"
    workflow: auto-major-incident
    failure_domain: identity-security

  security-control-failure:
    title: Security Control Failure
    class: security_control
    detection: threshold
    monitor_type: query alert
    query: "sum(last_1h):sum:acme.security.control_failures{env:__ENV__} by {control}.as_count() > 0"
    thresholds: { critical: 0 }
    group_by: [control]
    severity_class: page
    slo_id: slo-sec-notification-delivery
    runbook: "Runbook: Critical Vulnerability Overdue"
    workflow: auto-compliance-ticket
    failure_domain: security-response

  security-signal-high-confidence:
    title: High-Confidence Security Signal
    class: security_control
    detection: threshold
    monitor_type: event-v2 alert
    query: 'events("source:security_monitoring status:(error OR critical) env:__ENV__").rollup("count").by("signal_rule").last("15m") > 0'
    thresholds: { critical: 0 }
    group_by: [signal_rule]
    severity_class: page_fast
    slo_id: slo-sec-notification-delivery
    runbook: "Runbook: Okta Identity Provider Outage"
    workflow: auto-major-incident
    failure_domain: security-response
    envs: [prod]

  external-cert-expiry:
    title: External Certificate Expiration
    class: compliance_absolute
    detection: threshold
    monitor_type: query alert
    query: "min(last_2h):min:synthetics.ssl.days_left{env:__ENV__} by {check_id} < 14"
    thresholds: { critical: 14, warning: 30 }
    group_by: [check_id]
    severity_class: page
    slo_id: slo-infra-certificate-renewal
    runbook: "Runbook: Certificate Expiration"
    workflow: auto-cert-renewal-ticket
    failure_domain: identity-security
    rationale_fixed_threshold: "Certificate expiry is an absolute boundary."
