name: drift-detection
# Nightly: any divergence between code and the org (click-ops edits, deleted
# resources, runbook drift) turns this workflow red and files the evidence.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: datadog-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt
      - name: Terraform drift (detailed exit code)
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          set +e; rc=0
          for d in stacks/foundation stacks/coverage; do
            (cd $d && terraform init -input=false -backend-config=../backend.prod.hcl >/dev/null \
              && terraform plan -input=false -detailed-exitcode); [ $? -eq 2 ] && rc=2
          done
          exit $rc
      - name: Runbook drift
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: cd tools && python publish_runbooks.py --check
