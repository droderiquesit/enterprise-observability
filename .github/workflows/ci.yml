name: ci
# =============================================================================
# VALIDATION PIPELINE — every stage is a guardrail that can fail the build.
#
#   YAML → schema → tests (policy lint, manifests, runbooks, generated docs,
#   scorecard, governance & scale) → fmt → validate → offline plan →
#   determinism → security → credentialed plan + live monitor validation
#
# The per-tool checks (validate_policy, validate_monitors, runbook registry
# sync, matrix/runbook staleness, scorecard thresholds) all run INSIDE the
# pytest suite — tests/ asserts each one — so they are not repeated as
# separate stages here. Anyone can run the same gate locally with
# `make validate`.
# =============================================================================
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: policy & configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install tooling
        run: pip install -r tools/requirements-dev.txt

      - name: "YAML syntax"
        run: |
          python - <<'PY'
          import sys, yaml, pathlib
          bad = []
          for p in sorted(pathlib.Path("platform").rglob("*.yaml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as exc:
                  bad.append(f"{p}: {exc}")
          for b in bad:
              print("YAML ERROR:", b)
          sys.exit(1 if bad else 0)
          PY

      - name: "JSON schema — service registrations & monitor manifests"
        run: |
          python - <<'PY'
          import json, sys, pathlib, yaml, jsonschema
          fails = 0
          for schema_name, glob in (("monitor", "platform/monitors/*.yaml"),
                                    ("service", "platform/services/*.yaml")):
              schema = json.loads(pathlib.Path(f"platform/schemas/{schema_name}.schema.json").read_text())
              for p in sorted(pathlib.Path().glob(glob)):
                  try:
                      jsonschema.validate(yaml.safe_load(p.read_text()), schema)
                  except jsonschema.ValidationError as exc:
                      print(f"SCHEMA ERROR {p}: {exc.message} (at {list(exc.path)})")
                      fails += 1
          sys.exit(1 if fails else 0)
          PY

      - name: "Policy, manifests, runbooks, generated docs, scorecard, scale — pytest"
        run: python -m pytest tests/ -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: generated/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "terraform fmt"
        run: terraform fmt -recursive -check

      - name: "terraform validate (all modules and stacks)"
        run: |
          for d in modules/* stacks/coverage stacks/foundation; do
            echo "== $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

      - name: "Offline plan — preconditions, budgets, cardinality gates"
        # The stacks were initialized by the validate loop above; no backend
        # exists (ADR-016), so no re-init is needed.
        run: |
          cd stacks/coverage
          DD_API_KEY=offline DD_APP_KEY=offline terraform plan -input=false \
            -var datadog_validate=false -out=plan.out
          cd ../foundation
          DD_API_KEY=offline DD_APP_KEY=offline terraform plan -input=false \
            -var datadog_validate=false -var manage_rbac=false

      - name: "Determinism — a second plan must equal the first"
        run: |
          cd stacks/coverage
          terraform show -json plan.out | jq -S '.resource_changes | map({address, actions: .change.actions})' > p1.json
          DD_API_KEY=offline DD_APP_KEY=offline terraform plan -input=false \
            -var datadog_validate=false -out=plan2.out
          terraform show -json plan2.out | jq -S '.resource_changes | map({address, actions: .change.actions})' > p2.json
          diff p1.json p2.json

      - name: "Estate report on the PR"
        run: |
          cd stacks/coverage
          echo '### Planned monitoring estate' >> $GITHUB_STEP_SUMMARY
          terraform show -json plan.out | jq -r '
            [.resource_changes[] | select(.type == "datadog_monitor")] as $m
            | {
                monitors: ($m | length),
                per_env: ($m | map(.change.after.tags[]? | select(startswith("env:")) | sub("env:";""))
                             | group_by(.) | map({(.[0]): length}) | add),
                slos: ([.resource_changes[] | select(.type == "datadog_service_level_objective")] | length)
              }' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Trivy is tfsec's maintained successor — tfsec is frozen and its parser
      # rejects Terraform `check` blocks, which this repo uses.
      - name: "IaC misconfiguration scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: "Secret scan"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------------
  credentialed-plan:
    name: live monitor validation
    # Runs only where the CI service-account secrets exist (never on forks).
    # Every planned monitor is checked against Datadog's own validation API
    # before merge, so a syntactically invalid query cannot reach production.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: datadog-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tools/requirements.txt
      - name: "Plan, then validate every planned monitor against the live API"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then echo "no secrets in this context — skipping"; exit 0; fi
          cd stacks/coverage
          terraform init -input=false >/dev/null
          terraform plan -input=false -var datadog_validate=false -out=plan.out
          terraform show -json plan.out > plan.json
          cd ../../tools
          python validate_live.py ../stacks/coverage/plan.json
