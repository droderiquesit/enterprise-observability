# =============================================================================
# MONITOR ARCHETYPE CATALOG — SNOWFLAKE
#
# Telemetry source: the Datadog Snowflake integration, which queries
# SNOWFLAKE.ACCOUNT_USAGE on a schedule. Two consequences shape everything
# below and are the reason none of these archetypes use short windows:
#
#   1. ACCOUNT_USAGE views lag reality by minutes to hours. Snowflake alerting
#      is a TREND discipline, not a real-time one.
#   2. The integration emits account- and warehouse-level aggregates, not
#      per-query rows. Anything needing per-query or per-task detail has to
#      come from a custom emitter, and is marked as such.
#
# Credit consumption is monitored here because in Snowflake, spend IS a
# reliability signal: a warehouse that suddenly burns credits is usually a
# runaway query or an auto-scale loop, not a finance event.
# =============================================================================
version: 2
domain: database

archetypes:

  snowflake-connectivity-failure:
    title: Snowflake Account Unreachable
    signal: availability
    impact_class: customer_impact
    detection: service_check
    monitor_type: service check
    resource_type: snowflake_account
    selector: ""
    query: '"snowflake.can_connect".over("__SCOPE__").by("host").last(3).count_by_status()'
    thresholds: { critical: 2, warning: 1 }
    group_by: [host]
    evaluation_window: last_3_checks
    envs: [prod]
    bands: [critical]
    slo_id: slo-database-availability
    runbook: snowflake-connectivity-failure
    workflow: diag-database
    failure_domain: analytics
    mandatory: true
    rationale_fixed_threshold: >
      The integration either authenticates and queries ACCOUNT_USAGE or it does
      not. Two consecutive failures separates a transient network blip from an
      account, credential or network-policy problem.

  snowflake-query-latency-anomaly:
    title: Snowflake Query Execution Time Anomaly
    signal: latency
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_warehouse
    selector: ""
    query: "avg(last_2h):anomalies(avg:snowflake.query.execution_time{__SCOPE__} by {warehouse}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [warehouse]
    evaluation_window: last_2h
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-database-latency
    runbook: snowflake-query-latency-anomaly
    workflow: diag-database
    failure_domain: analytics
    notes: >
      Per warehouse, against its own baseline. An absolute number is
      meaningless across warehouses whose workloads range from sub-second
      dashboards to multi-hour transformations.

  snowflake-warehouse-queueing:
    title: Snowflake Warehouse Queueing (Overload)
    signal: saturation
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_warehouse
    selector: ""
    query: "avg(last_2h):anomalies(avg:snowflake.query.queued_overload{__SCOPE__} by {warehouse}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [warehouse]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-database-latency
    runbook: snowflake-warehouse-queueing
    workflow: diag-database
    failure_domain: analytics
    notes: >
      Queued-overload time is the honest saturation signal for a warehouse:
      the work arrived, the compute was already busy, and the query waited.

  snowflake-warehouse-provisioning-delay:
    title: Snowflake Warehouse Provisioning Delay
    signal: latency
    impact_class: risk
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_warehouse
    selector: ""
    query: "avg(last_2h):anomalies(avg:snowflake.query.queued_provision{__SCOPE__} by {warehouse}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [warehouse]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical]
    slo_id: slo-database-latency
    runbook: snowflake-warehouse-provisioning-delay
    workflow: diag-database
    failure_domain: analytics
    notes: >
      Distinct from queueing: this is time spent waiting for Snowflake to
      START compute, which points at auto-resume behaviour and warehouse sizing
      rather than at concurrency.

  snowflake-query-blocked:
    title: Snowflake Blocked Query Contention
    signal: saturation
    impact_class: degradation
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_warehouse
    selector: ""
    query: "avg(last_2h):anomalies(avg:snowflake.query.blocked{__SCOPE__} by {warehouse}, 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [warehouse]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical]
    slo_id: slo-database-latency
    runbook: snowflake-query-blocked
    workflow: diag-database
    failure_domain: analytics
    notes: >
      Transaction-level contention — queries waiting on locks held by another
      transaction, usually a long-running DML on the same table.

  snowflake-credit-consumption-anomaly:
    title: Snowflake Credit Consumption Anomaly
    signal: cost
    impact_class: hygiene
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_warehouse
    selector: ""
    query: "avg(last_1d):anomalies(sum:snowflake.billing.warehouse.total_credit.sum{__SCOPE__} by {warehouse}.as_rate(), 'basic', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [warehouse]
    evaluation_window: last_1d
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: snowflake-credit-consumption-anomaly
    workflow: auto-finops-review
    failure_domain: analytics
    notes: >
      In Snowflake a credit spike is usually an engineering defect wearing a
      finance costume — a runaway query, a cross join, an auto-scale loop, or a
      warehouse someone forgot to auto-suspend.

  snowflake-storage-growth-forecast:
    title: Snowflake Storage Growth Forecast
    signal: capacity
    impact_class: risk
    detection: forecast
    monitor_type: query alert
    resource_type: snowflake_account
    selector: ""
    query: "max(next_1w):forecast(avg:snowflake.storage.storage_bytes.total{__SCOPE__} by {host}, 'linear', 1, interval='1h', history='1w') > 0"
    thresholds: { critical: 0 }
    group_by: [host]
    evaluation_window: next_1w
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: snowflake-storage-growth-forecast
    workflow: auto-capacity-ticket
    failure_domain: analytics
    notes: >
      Snowflake storage has no hard ceiling — it has a bill. The forecast is
      reviewed against the committed capacity in the runbook rather than
      against a fixed byte count that would be wrong within a quarter.

  snowflake-failsafe-growth:
    title: Snowflake Fail-safe Storage Growth
    signal: capacity
    impact_class: hygiene
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_account
    selector: ""
    query: "avg(last_1d):anomalies(avg:snowflake.storage.failsafe_bytes.total{__SCOPE__} by {host}, 'basic', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [host]
    evaluation_window: last_1d
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: snowflake-failsafe-growth
    workflow: auto-finops-review
    failure_domain: analytics
    notes: >
      Fail-safe growth that outpaces active storage means large tables are
      being churned or recreated rather than merged — an expensive pattern that
      is invisible in query cost.

  snowflake-login-failure-anomaly:
    title: Snowflake Login Failure Anomaly
    signal: auth_anomaly
    impact_class: risk
    detection: anomaly
    monitor_type: query alert
    resource_type: snowflake_account
    selector: ""
    query: "avg(last_2h):anomalies(sum:snowflake.logins.fail.count{__SCOPE__} by {host}.as_rate(), 'agile', 3, direction='above') >= 1"
    thresholds: { critical: 1.0 }
    group_by: [host]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical]
    slo_id: slo-security-telemetry
    runbook: snowflake-login-failure-anomaly
    workflow: diag-security-control
    failure_domain: analytics

  snowflake-pipe-ingestion-stalled:
    title: Snowflake Snowpipe Ingestion Stalled
    signal: freshness
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: snowflake_account
    selector: ""
    query: "sum(last_2h):sum:snowflake.pipe.files_inserted.sum{__SCOPE__} by {host}.as_count() < 1"
    thresholds: { critical: 1 }
    group_by: [host]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical]
    slo_id: slo-data-freshness
    runbook: snowflake-pipe-ingestion-stalled
    workflow: diag-data-pipeline
    failure_domain: analytics
    rationale_fixed_threshold: >
      An account with Snowpipe configured ingests continuously. Zero files
      inserted across two hours means the pipe is paused, erroring, or its
      stage notification has stopped — all of which stall downstream freshness.

  # TELEMETRY GAP, IMPLEMENTED. The Datadog Snowflake integration publishes
  # account and warehouse aggregates; it does not publish per-task or per-query
  # failure counts. Task and pipeline failures are therefore emitted by a
  # scheduled ACCOUNT_USAGE exporter as `acme.snowflake.task_failures` — see
  # docs/telemetry-gaps.md. This is deliberately a custom metric rather than a
  # proxy invented from credit or query aggregates.
  snowflake-task-failure:
    title: Snowflake Task Failure
    signal: job_failure
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: snowflake_account
    selector: ""
    query: "sum(last_1h):sum:acme.snowflake.task_failures{__SCOPE__} by {task_name}.as_count() > 0"
    thresholds: { critical: 0 }
    group_by: [task_name]
    evaluation_window: last_1h
    envs: [prod, stage]
    bands: [critical]
    slo_id: slo-data-freshness
    runbook: snowflake-task-failure
    workflow: remediate-rerun-job
    failure_domain: analytics
    rationale_fixed_threshold: >
      A scheduled task either succeeded or it did not. Downstream tables are
      stale from the first failure, so there is no tolerance band to tune.
