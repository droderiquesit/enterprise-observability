# archetype: custom — the escape hatch for a signal the catalog does not model.
# It costs more review (an explicit query and a justification) precisely so
# that reaching for it is a deliberate act rather than a habit.
monitor:
  name: checkout-payment-authorization-rate
  archetype: custom
  service: checkout-api
  team: payments
  env:
    - prod

  domain: api
  monitor_type: query alert
  detection: anomaly
  impact_class: customer_impact
  resource_type: service

  query: >-
    avg(last_15m):anomalies(sum:acme.payments.authorizations{env:prod,service:checkout-api,result:declined}.as_rate()
    / sum:acme.payments.authorizations{env:prod,service:checkout-api}.as_rate(), 'agile', 3, direction='above') >= 1

  thresholds:
    critical: 1.0

  group_by: []

  slo: slo-api-availability
  priority: P1

  notification_profile: production_critical
  runbook: api-availability
  workflow: diag-api-health

  summary: Payment authorization decline ratio has deviated from its learned baseline.
  impact: >
    Customers cannot complete purchases. A decline-rate shift is usually an
    acquirer or issuer problem and is invisible to availability monitoring —
    every request succeeds with HTTP 200 while no money moves.
  justification: >
    No catalog archetype models a business-outcome ratio. This is the single
    highest-value signal for the payments business and cannot be expressed as
    an infrastructure or golden-signal monitor.
