# =============================================================================
# RUNBOOK REGISTRY
#
# ONE RUNBOOK PER ARCHETYPE — the id is the archetype id. This is not a
# convention for tidiness: it is what makes "every actionable monitor has a
# runbook" mechanically checkable instead of aspirational. CI fails if an
# archetype names a runbook that is not in this registry.
#
#   source   markdown template under platform/runbooks/ (authored, PR-reviewed)
#   id       published Datadog notebook id, reconciled by
#            tools/publish_runbooks.py (ADR-006: the provider has no notebook
#            resource, so publishing is API-backed with a content hash)
#
# `id` is LOAD-BEARING, not decoration: stacks/coverage attaches the notebook to
# every monitor generated from the archetype through the monitor's native
# `assets` field (category=runbook, resource_type=notebook, resource_key=id).
# An entry without an id cannot be attached, so CI fails on a missing id.
#
# review_anchor / review_interval_days drive the "next review due" date printed
# in every runbook. They are a committed anchor rather than today's date so a
# regenerated runbook is byte-identical tomorrow and staleness stays checkable.
# =============================================================================
version: 2

notebook_base_url: https://app.datadoghq.com/notebook
review_anchor: "2026-08-18"
review_interval_days: 90

