# =============================================================================
# MONITOR ARCHETYPE CATALOG — SHARED PLATFORM SERVICES & THE OBSERVABILITY
# PLATFORM ITSELF
#
# "Who watches the watchmen" — these archetypes protect the monitoring estate.
# A silent pipeline, an expired exception, or an untagged fleet degrades every
# other monitor in this repository, so they are treated as first-class signals
# owned by the observability-platform team.
# =============================================================================
version: 2
domain: platform

archetypes:

  platform-service-unavailable:
    title: Shared Platform Service Unavailable
    signal: availability
    impact_class: customer_impact
    detection: threshold
    monitor_type: query alert
    resource_type: service
    telemetry: [apm]
    selector: "service_archetype:platform_service"
    query: 'sum(last_5m):sum:trace.http.request.hits{__SCOPE__,http.status_class:5xx} by {service}.as_count() / sum:trace.http.request.hits{__SCOPE__} by {service}.as_count() > 0.5'
    thresholds: { critical: 0.5, warning: 0.2 }
    group_by: [service]
    evaluation_window: last_5m
    envs: [prod, stage]
    bands: [critical, standard]
    slo_id: slo-platform-services
    runbook: platform-service-unavailable
    workflow: diag-app-health
    failure_domain: observability-platform
    mandatory: true
    rationale_fixed_threshold: >
      A shared platform service failing for most callers is an availability
      boundary that multiplies across every consuming team.

  monitor-estate-budget-exceeded:
    title: Managed Monitor Budget Exceeded
    signal: telemetry_health
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: monitoring_platform
    telemetry: [platform_self_telemetry]
    selector: ""
    query: 'max(last_1h):max:acme.observability.managed_monitor_count{__SCOPE__} > 1500'
    thresholds: { critical: 1500, warning: 1200 }
    group_by: []
    evaluation_window: last_1h
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: monitor-estate-budget-exceeded
    workflow: auto-ticket-sustained
    failure_domain: observability-platform
    mandatory: true
    rationale_fixed_threshold: >
      The monitor budget from global.yaml. Crossing it means the framework's
      bounded-object invariant has been violated and monitor sprawl has begun.

  clickops-monitor-detected:
    title: Unmanaged (Click-Ops) Monitor Detected
    signal: drift
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: monitoring_platform
    telemetry: [platform_self_telemetry]
    selector: ""
    query: 'max(last_1h):max:acme.observability.unmanaged_monitor_count{__SCOPE__} > 0'
    thresholds: { critical: 0 }
    group_by: []
    evaluation_window: last_1h
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: clickops-monitor-detected
    workflow: auto-drift-ticket
    failure_domain: observability-platform
    mandatory: true
    rationale_fixed_threshold: >
      Any monitor without managed_by:terraform is drift by definition. The
      threshold is zero because the policy is absolute.

  ingest-pipeline-degraded:
    title: Telemetry Ingest Pipeline Degraded
    signal: telemetry_health
    impact_class: customer_impact
    detection: rate_of_change
    monitor_type: query alert
    resource_type: monitoring_platform
    telemetry: [datadog_usage_metrics]
    selector: ""
    query: 'pct_change(avg(last_15m),last_4h):sum:datadog.estimated_usage.metrics.custom{__SCOPE__}.as_rate() < -40'
    thresholds: { critical: -40, warning: -20 }
    group_by: []
    evaluation_window: last_15m
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: ingest-pipeline-degraded
    workflow: auto-major-incident
    failure_domain: observability-platform
    mandatory: true
    notes: >
      A 40% collapse in custom-metric ingest means a large part of the estate
      has gone dark. This is the highest-leverage monitor in the repository:
      it is what stops "all green" from meaning "all blind".

  exception-expired:
    title: Approved Exception Has Expired
    signal: drift
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: monitoring_platform
    telemetry: [platform_self_telemetry]
    selector: ""
    query: 'max(last_6h):max:acme.observability.expired_exceptions{__SCOPE__} > 0'
    thresholds: { critical: 0 }
    group_by: []
    evaluation_window: last_6h
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: exception-expired
    workflow: auto-ticket-sustained
    failure_domain: observability-platform
    mandatory: true
    rationale_fixed_threshold: >
      An expired exception is an ungoverned deviation. Zero tolerance is the
      point of having an expiry date at all.

  unowned-resource-backlog:
    title: Unowned Resource Backlog
    signal: drift
    impact_class: hygiene
    detection: threshold
    monitor_type: query alert
    resource_type: monitoring_platform
    telemetry: [platform_self_telemetry]
    selector: ""
    query: 'max(last_6h):max:acme.observability.unowned_resources_over_sla{__SCOPE__} > 0'
    thresholds: { critical: 0 }
    group_by: []
    evaluation_window: last_6h
    envs: [prod]
    bands: [critical]
    slo_id: slo-platform-services
    runbook: unowned-resource-backlog
    workflow: auto-ticket-sustained
    failure_domain: observability-platform
    mandatory: true
    rationale_fixed_threshold: >
      Resources past the 14-day ownership SLA. Unowned means unactionable —
      an alert nobody receives is worse than no alert.

  cicd-pipeline-failure:
    title: Platform Deployment Pipeline Failing
    signal: job_failure
    impact_class: degradation
    detection: threshold
    monitor_type: query alert
    resource_type: pipeline
    telemetry: [ci_visibility]
    selector: "resource_type:cicd_pipeline"
    query: 'sum(last_2h):sum:datadog.ci.pipeline.runs{__SCOPE__,status:error} by {repository,pipeline_name}.as_count() >= 2'
    thresholds: { critical: 2, warning: 1 }
    group_by: [repository, pipeline_name]
    evaluation_window: last_2h
    envs: [prod]
    bands: [critical, standard]
    slo_id: slo-platform-services
    runbook: cicd-pipeline-failure
    workflow: auto-ticket-sustained
    failure_domain: ci-cd
    mandatory: false
    rationale_fixed_threshold: >
      Two consecutive pipeline failures separates a flaky run from a broken
      deployment path.
